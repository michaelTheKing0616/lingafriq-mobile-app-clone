name: lingafriq
description: A new Flutter project.

# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName and build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString and build-number used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
version: 1.6.0+175

environment:
  sdk: ">=3.8.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies, consider running
# `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below
# to the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_hooks: ^0.21.3+1
  hooks_riverpod: ^3.0.3
  riverpod: ^3.0.3
  flutter_screenutil: ^5.9.3 
  velocity_x: ^4.2.1 
  animated_bottom_navigation_bar: ^1.4.0
  auto_size_text: ^3.0.0
  loading_overlay_pro: ^2.1.1 
  flutter_launcher_icons: ^0.14.4
  shared_preferences: ^2.5.3
  path_provider: ^2.1.5
  dio: ^5.9.0
  cached_network_image: ^3.4.1 
  flutter_tts: ^4.2.3
  better_player_plus: ^1.1.2
  # better_player: ^0.0.84 
  just_audio: ^0.10.5
  flutter_inappwebview: ^6.1.5 
  intl: ^0.20.2
  url_launcher: ^6.3.2
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  change_app_package_name: ^1.5.0
  flutter_animate: ^4.5.2
  uuid: ^4.5.1
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  file_picker: ^8.1.2
  image_picker: ^1.0.7
  # ML Kit for OCR/Text Recognition
  google_mlkit_text_recognition: ^0.15.1
  # Offline & Background Services
  # livekit_client >=2.3.x requires connectivity_plus ^6.x
  connectivity_plus: ^6.1.5
  workmanager: ^0.9.0+3
  archive: ^3.4.9
  crypto: ^3.0.5
  encrypt: ^5.0.3
  # Auth & Security
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.3.0
  # Error Tracking & Monitoring
  sentry_flutter: ^7.0.0
  package_info_plus: ^9.0.0
  # Audio & Media
  record: ^6.1.2  # Updated to latest version to fix record_linux compatibility
  audioplayers: ^6.1.0
  # Networking
  socket_io_client: ^2.0.3+1
  # Real-time Communication
  # Upgrade to a LiveKit version whose iOS podspec is compatible with flutter_webrtc 0.12.x
  # (same WebRTC-SDK version), avoiding CocoaPods WebRTC-SDK conflicts on main.
  livekit_client: ^2.3.6
  # Game Engine & Animation
  rive: ^0.12.4
  flame: ^1.18.0
  # Audio Analysis
  # pitch_detector: ^0.1.0  # Package not available on pub.dev - removed
  speech_to_text: ^7.0.0
  # Haptic Feedback
  flutter_vibrate: ^1.3.0
  # Permissions
  permission_handler: ^11.3.1
  # Charts & Visualization
  fl_chart: ^0.69.0
  # Environment Variables
  flutter_dotenv: ^5.1.0
  purchases_flutter: ^9.11.0
  state_notifier: ^1.0.0

dependency_overrides:
  # Fix record_linux compatibility issue - update to latest compatible version
  record_platform_interface: ^1.4.0

  # Align flutter_webrtc with LiveKit iOS podspec to avoid WebRTC-SDK (=X) conflicts.
  # Also avoids the deprecated embedding v1 Registrar compilation errors seen with flutter_webrtc 0.9.47.
  flutter_webrtc: 0.12.12+hotfix.1

# Exclude Linux platform to avoid record_linux compatibility issues
# This will prevent Linux builds but allow Android/iOS to work
platforms:
  android:
  ios:
  web:
  macos:
  windows:


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0



flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon.png"
  adaptive_icon_background: "assets/images/background.png"
  adaptive_icon_foreground: "assets/images/foreground.png"
  remove_alpha_ios: true


flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/images/
    - assets/alphabets/
    - assets/fonts/
    - assets/rive/



  fonts:
    - family: dosis
      fonts:
        - asset: assets/fonts/Dosis-ExtraLight.ttf
          weight: 100
        - asset: assets/fonts/Dosis-Light.ttf
          weight: 300
        - asset: assets/fonts/Dosis-Regular.ttf
          weight: 400
        - asset: assets/fonts/Dosis-Medium.ttf
          weight: 500
        - asset: assets/fonts/Dosis-Semibold.ttf
          weight: 600
        - asset: assets/fonts/Dosis-Bold.ttf
          weight: 700
        - asset: assets/fonts/Dosis-ExtraBold.ttf
          weight: 800

