name: Automated Content Generation

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      language:
        description: 'Specific language to generate (leave empty for all)'
        required: false
        type: string

jobs:
  generate-content:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd tools/content_generation
          pip install requests python-dotenv
      
      - name: Generate content
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          cd tools/content_generation
          if [ -z "${{ github.event.inputs.language }}" ]; then
            python enhanced_content_generator.py
          else
            python enhanced_content_generator.py --language "${{ github.event.inputs.language }}"
          fi
      
      - name: Upload to backend
        env:
          BACKEND_API_URL: ${{ secrets.BACKEND_API_URL }}
          BACKEND_API_KEY: ${{ secrets.BACKEND_API_KEY }}
        run: |
          cd tools/content_generation
          python backend_integration.py
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: generated-content
          path: tools/content_generation/generated_content/*.json
          retention-days: 7
