name: Build and Release

# DISABLED - Use build-and-release.yml instead
# This workflow does not generate signed AAB/IPA files
on:
  workflow_dispatch: # Manual trigger only - not used for releases

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          fetch-depth: 0

      - name: 🔧 Ensure Gradle wrapper is executable
        run: |
          chmod +x android/gradlew || true
      
      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.0'
          channel: 'stable'
      
      - name: 🔧 Install CMake (required for rive_common native builds)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake
          cmake --version
          echo "✅ CMake installed successfully"
      
      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Flutter analyze
        run: bash scripts/ci/analyze_new_code.sh

      - name: i18n literal gate
        run: dart run tool/i18n_gate.dart

      - name: TTS purity gate (no flutter_tts outside AfricanTtsService)
        run: dart run tool/tts_purity_gate.dart

      - name: Placeholder / template bundle linter
        run: |
          python3 scripts/ci/placeholder_linter.py assets/data
          python3 scripts/ci/placeholder_linter.py schemas/v2
          python3 scripts/ci/placeholder_lint.py --baseline scripts/ci/lint_baseline.tsv
          # Claim lint reads bundled curriculum only. Runtime Import Media lessons are not in this job.
          python3 scripts/ci/claim_lint.py --baseline scripts/ci/lint_baseline.tsv
          python3 test/ci/lint_fixtures_test.py

      - name: Secrets
        run: |
          node scripts/secrets-hygiene-check.mjs --strict
          curl -sSL -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          mkdir -p "$HOME/bin"
          tar -xzf /tmp/gitleaks.tar.gz -C "$HOME/bin" gitleaks
          if [ -n "${GITHUB_BASE_REF:-}" ]; then
            range="origin/${GITHUB_BASE_REF}..HEAD"
          elif [ -n "${GITHUB_EVENT_BEFORE:-}" ] && [ "$GITHUB_EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range="${GITHUB_EVENT_BEFORE}..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          "$HOME/bin/gitleaks" git --redact --no-banner --log-opts="$range"

      - name: Prepare Rive native runtime
        run: |
          dart run rive_native:setup --platform linux
          echo "LD_LIBRARY_PATH=$PWD/build/rive_native/native/build/linux/bin/lib/debug_shared" >> $GITHUB_ENV

      - name: Avatar contract
        run: flutter test test/avatar/contract_test.dart

      - name: Flutter test
        run: |
          echo "🧪 Running Flutter tests..."
          flutter test
          echo "✅ Flutter tests passed"

      - name: 🧹 Comprehensive Cache Clearing (Before Build)
        run: |
          echo "🧹 Starting comprehensive cache clearing..."
          
          # 1. Flutter clean - removes build artifacts
          echo "📦 Step 1: Flutter clean..."
          flutter clean || true
          
          # 2. Clear Flutter pub cache (if needed)
          echo "📦 Step 2: Clearing Flutter pub cache..."
          flutter pub cache repair || true
          
          # 3. Remove build directories
          echo "🗑️ Step 3: Removing build directories..."
          rm -rf build/ || true
          rm -rf .dart_tool/ || true
          rm -rf .flutter-plugins || true
          rm -rf .flutter-plugins-dependencies || true
          rm -rf .packages || true
          
          # 4. Clear Gradle cache
          echo "🔄 Step 4: Clearing Gradle cache..."
          chmod +x android/gradlew || true
          cd android || exit 0
          ./gradlew clean --refresh-dependencies || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/transforms-* || true
          rm -rf ~/.gradle/daemon || true
          cd ..
          
          # 5. Clear Android build cache
          echo "📱 Step 5: Clearing Android build cache..."
          rm -rf android/.gradle || true
          rm -rf android/app/build || true
          rm -rf android/build || true
          
          # 6. Get fresh dependencies
          echo "📥 Step 6: Getting fresh dependencies..."
          flutter pub get
          
          echo "✅ Cache clearing complete!"
      
      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=STABILITY_AI_KEY=${{ secrets.STABILITY_AI_KEY }} \
            --dart-define=HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }} \
            --dart-define=REPLICATE_API_KEY=${{ secrets.REPLICATE_API_KEY }} \
            --dart-define=LEONARDO_API_KEY=${{ secrets.LEONARDO_API_KEY }}
        continue-on-error: true # Build will work even if some secrets are missing
      
      - name: Build App Bundle (for Play Store)
        run: |
          flutter build appbundle --release \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=STABILITY_AI_KEY=${{ secrets.STABILITY_AI_KEY }} \
            --dart-define=HUGGINGFACE_TOKEN=${{ secrets.HUGGINGFACE_TOKEN }} \
            --dart-define=REPLICATE_API_KEY=${{ secrets.REPLICATE_API_KEY }} \
            --dart-define=LEONARDO_API_KEY=${{ secrets.LEONARDO_API_KEY }}
        continue-on-error: true
      
      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Upload App Bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: success()
        with:
          name: release-appbundle
          path: build/app/outputs/bundle/release/app-release.aab

