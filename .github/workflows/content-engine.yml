name: Content engine

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sharealike-containment:
    name: Share-alike containment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # check_verbatim loads compat_checklist.yaml through PyYAML.
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3

      - name: Share-alike containment tests
        run: python3 -m pytest tools/content_engine/tests/test_sharealike_containment.py

  exclusion-enforce:
    name: Non-commercial exclusion
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      # exclusions.yaml is loaded through PyYAML.
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check pytest==9.1.1 PyYAML==6.0.3

      - name: Exclusion enforcement tests
        run: python3 -m pytest tools/content_engine/tests/test_exclusion_enforce.py tools/content_engine/tests/test_excl_x_jw.py
