name: Mongo PIT restore drill

# P12-018: quarterly Atlas point-in-time restore verification (simulate in CI).
on:
  workflow_dispatch:
  schedule:
    - cron: "0 7 1 */3 *"

permissions:
  contents: read

jobs:
  drill:
    name: Mongo PIT restore drill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Tests
        run: python3 test/release/mongo_pit_restore_drill_test.py

      - name: Run drill (simulate)
        run: |
          python3 scripts/release/mongo_pit_restore_drill.py run \
            --mode simulate \
            --report release/fixtures/mongo_pit_restore_report.json \
            --ledger release/mongo_pit_restore_ledger.json

      - name: Upload drill report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mongo-pit-restore-drill-report
          path: |
            release/fixtures/mongo_pit_restore_report.json
            release/mongo_pit_restore_ledger.json
          retention-days: 365
