name: Pub outdated

on:
  schedule:
    - cron: '0 9 1 * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  outdated:
    name: Post flutter pub outdated
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Collect outdated packages
        run: |
          set +e
          flutter pub outdated --no-dependency-overrides > outdated.txt
          echo "exit:$?" >> outdated.txt

      - name: Open an issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '```'
            head -c 60000 outdated.txt
            echo
            echo '```'
          } > issue.md
          gh issue create \
            --title "flutter pub outdated $(date -u +%Y-%m)" \
            --body-file issue.md
