name: Content CI

on:
  pull_request:
    paths:
      - 'schemas/v2/**'
      - 'tools/content/**'
      - 'test/content/**'
      - '.github/workflows/content_ci.yml'
  push:
    paths:
      - 'schemas/v2/**'
      - 'tools/content/**'
      - 'test/content/**'
      - '.github/workflows/content_ci.yml'
  workflow_dispatch:

jobs:
  label-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest==9.1.1 pytest-cov==6.0.0

      - name: P5-011 label exclusion rules
        run: python -m pytest test/content/label_rules_test.py -q --cov=tools.content.label_rules --cov-report=term-missing --cov-fail-under=70
