name: Content validate

on:
  pull_request:
    paths:
      - 'schemas/**'
      - 'content/**'
      - 'curriculum/**'
      - 'tools/content_pipeline/**'
      - 'test/content/**'
      - '.github/workflows/content-validate.yml'
  push:
    paths:
      - 'schemas/**'
      - 'content/**'
      - 'curriculum/**'
      - 'tools/content_pipeline/**'
      - 'test/content/**'
      - '.github/workflows/content-validate.yml'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install validator dependencies
        run: |
          python -m pip install --disable-pip-version-check pytest==9.1.1 jsonschema==4.23.0 referencing==0.36.2

      - name: P4-106 content validator tests
        run: python -m pytest test/content/test_validate_content.py -q

      - name: Scan v2 content schemas
        run: python tools/content_pipeline/validate_content.py schemas/v2/content
