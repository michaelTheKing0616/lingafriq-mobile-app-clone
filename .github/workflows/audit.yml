name: Audit

on:
  pull_request:
  push:
    branches: [main, cloud-handoff]

jobs:
  npm-audit:
    name: npm audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: A seeded high advisory fails the gate
        run: bash scripts/ci/dep_audit.sh --self-test

      - name: Audit lockfiles in this repo
        run: bash scripts/ci/dep_audit.sh
