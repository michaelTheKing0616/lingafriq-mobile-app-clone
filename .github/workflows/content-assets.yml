name: Content assets

on:
  push:
    paths:
      - 'tools/**'
      - 'tool/**'
      - 'assets/data/**'
      - 'schemas/**'
      - 'content/**'
      - 'scripts/content/**'
      - 'test/**'
      - '.github/workflows/content-assets.yml'
  pull_request:
    paths:
      - 'tools/**'
      - 'tool/**'
      - 'assets/data/**'
      - 'schemas/**'
      - 'content/**'
      - 'scripts/content/**'
      - 'test/**'
      - '.github/workflows/content-assets.yml'
  workflow_dispatch:

jobs:
  content-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Content v1 validator
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.23.0
          python scripts/content/validate_content.py --legacy-report "$RUNNER_TEMP/legacy-migration.txt" \
            curriculum_bundle curriculum_expanded_bundle lingafriq_FINAL_curriculum lingafriq_full_curriculum_bundle
          python test/content/validator_test.py

      - name: Regenerate bundled content
        run: python tools/generate_lingafriq_content.py

      - name: Placeholder gate
        run: |
          if rg -n "Wrong|Also wrong|word1a|Yor_word" assets/data/; then
            echo "Placeholder strings found in assets/data"
            exit 1
          fi
          echo "No placeholder markers in assets/data"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.35.0'
          channel: stable

      - name: Flutter pub get
        run: flutter pub get

      - name: Content schema gate
        run: dart run tool/validate_content_schemas.dart

      - name: Content asset tests
        run: flutter test test/games/game_content_asset_test.dart test/content/
