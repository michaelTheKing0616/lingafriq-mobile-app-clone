name: Build and Release iOS & Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  increment-version:
    name: Increment Version Number
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.increment.outputs.version }}
      version_name: ${{ steps.increment.outputs.version_name }}
      build_number: ${{ steps.increment.outputs.build_number }}
    
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔢 Increment build number
        id: increment
        run: |
          # Extract current version from pubspec.yaml
          current_version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          version_name=$(echo $current_version | cut -d'+' -f1)
          build_number=$(echo $current_version | cut -d'+' -f2)
          
          # Ensure build number is at least 91 (last prod was 90)
          # If current build is less than 91, set to 91, otherwise increment
          if [ "$build_number" -lt 91 ]; then
            echo "⚠️ Build number $build_number is less than 91. Setting to 91."
            build_number=91
          elif [ "$build_number" -eq 90 ]; then
            echo "📦 Current build is 90, incrementing to 91."
            build_number=91
          else
            # Increment build number
            build_number=$((build_number + 1))
          fi
          
          new_version="${version_name}+${build_number}"
          
          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $new_version/" pubspec.yaml
          
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "version_name=$version_name" >> $GITHUB_OUTPUT
          echo "build_number=$build_number" >> $GITHUB_OUTPUT
          echo "📦 Updated version: $new_version (build number: $build_number)"

      - name: 💾 Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pubspec.yaml
          git commit -m "chore: auto-increment build number to ${{ steps.increment.outputs.version }}" || echo "No changes to commit"
          git push || echo "Push failed or no changes"

  build-android:
    name: Build Android App Bundle
    needs: increment-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.increment-version.outputs.version }}
      version_name: ${{ needs.increment-version.outputs.version_name }}
      build_number: ${{ needs.increment-version.outputs.build_number }}

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: 🔧 Install CMake (required for rive_common native builds)
        run: |
          # Install CMake via apt (Ubuntu) - must be before SDK installation
          sudo apt-get update
          sudo apt-get install -y cmake
          # Verify CMake installation
          cmake --version
          echo "✅ CMake installed successfully"

      - name: 🛠️ Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/tools/bin" >> $GITHUB_PATH

      - name: 🧩 Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🔢 Use incremented version
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          echo "📦 Using version: $version"
          grep "version: $version" pubspec.yaml || echo "⚠️ Version mismatch in pubspec.yaml"

      - name: 🔑 Setup signing key
        run: |
          echo "Decoding keystore..."
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "Creating key.properties..."
          mkdir -p android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      - name: 🧹 Comprehensive Cache Clearing (Before Build)
        run: |
          echo "🧹 Starting comprehensive cache clearing..."
          
          # 1. Flutter clean - removes build artifacts
          echo "📦 Step 1: Flutter clean..."
          flutter clean || true
          
          # 2. Clear Flutter pub cache (if needed)
          echo "📦 Step 2: Clearing Flutter pub cache..."
          flutter pub cache repair || true
          
          # 3. Remove build directories
          echo "🗑️ Step 3: Removing build directories..."
          rm -rf build/ || true
          rm -rf .dart_tool/ || true
          rm -rf .flutter-plugins || true
          rm -rf .flutter-plugins-dependencies || true
          rm -rf .packages || true
          
          # 4. Clear Gradle cache
          echo "🔄 Step 4: Clearing Gradle cache..."
          cd android || exit 0
          ./gradlew clean --refresh-dependencies || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 || true
          rm -rf ~/.gradle/caches/transforms-* || true
          rm -rf ~/.gradle/daemon || true
          cd ..
          
          # 5. Clear Android build cache
          echo "📱 Step 5: Clearing Android build cache..."
          rm -rf android/.gradle || true
          rm -rf android/app/build || true
          rm -rf android/build || true
          
          # 6. Get fresh dependencies
          echo "📥 Step 6: Getting fresh dependencies..."
          flutter pub get
          
          echo "✅ Cache clearing complete!"

      - name: 🗑️ Remove excluded plugins and create stubs
        run: |
          echo "🗑️ Removing flutter_webrtc and workmanager completely..."
          
          # Remove plugins after flutter clean regenerates plugin files
          chmod +x scripts/remove_webrtc_plugin.sh
          ./scripts/remove_webrtc_plugin.sh
          
          # Remove ALL possible build artifacts for BOTH plugins
          rm -rf build/flutter_webrtc || true
          rm -rf build/workmanager || true
          rm -rf android/.gradle/caches/transforms-*/flutter_webrtc || true
          rm -rf android/.gradle/caches/transforms-*/workmanager || true
          rm -rf android/app/build/intermediates/flutter_webrtc || true
          rm -rf android/app/build/intermediates/workmanager || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1/*/flutter_webrtc || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1/*/workmanager || true
          
          # Create stub manifests for BOTH plugins to prevent Gradle errors
          echo "📝 Creating stub manifests for excluded plugins..."
          
          # flutter_webrtc stub
          mkdir -p build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest
          echo '<?xml version="1.0" encoding="utf-8"?>' > build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.cloudwebrtc.webrtc">' >> build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          echo '    <application />' >> build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          echo '</manifest>' >> build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          
          # workmanager stub
          mkdir -p build/workmanager/intermediates/merged_manifest/release/processReleaseManifest
          echo '<?xml version="1.0" encoding="utf-8"?>' > build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="be.tramckrijte.workmanager">' >> build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          echo '    <application />' >> build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          echo '</manifest>' >> build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
          
          echo "✅ Both plugins removed and stubbed successfully"
          ls -la build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/ || true
          ls -la build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/ || true

      - name: 🏗️ Build AAB (Release)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=false -Dorg.gradle.console=plain"
        run: |
          echo "🏗️ Starting AAB build..."
          set +e  # Don't exit on error immediately
          
          # Function to create complete stub structure (needed after any clean operation)
          create_stub_manifests() {
            echo "📝 Creating complete stub structure for excluded plugins..."
            
            # flutter_webrtc stubs
            mkdir -p build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest
            mkdir -p build/flutter_webrtc/intermediates/navigation_json/release/extractDeepLinksRelease
            mkdir -p build/flutter_webrtc/intermediates/aar_metadata/release
            mkdir -p build/flutter_webrtc/intermediates/library_manifest/release
            mkdir -p build/flutter_webrtc/intermediates/symbol_list_with_package_name/release/generateReleaseRFile
            
            echo '<?xml version="1.0" encoding="utf-8"?>' > build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.cloudwebrtc.webrtc">' >> build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            echo '    <application />' >> build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            echo '</manifest>' >> build/flutter_webrtc/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            
            # navigation.json - Android Navigation component format
            # Must be a valid JSON array (can be empty for libraries without nav graphs)
            echo '[]' > build/flutter_webrtc/intermediates/navigation_json/release/extractDeepLinksRelease/navigation.json
            
            # FIXED: Proper aar-metadata.xml format
            echo '<?xml version="1.0" encoding="utf-8"?>' > build/flutter_webrtc/intermediates/aar_metadata/release/aar-metadata.xml
            echo '<aar-metadata>' >> build/flutter_webrtc/intermediates/aar_metadata/release/aar-metadata.xml
            echo '  <minCompileSdk>21</minCompileSdk>' >> build/flutter_webrtc/intermediates/aar_metadata/release/aar-metadata.xml
            echo '</aar-metadata>' >> build/flutter_webrtc/intermediates/aar_metadata/release/aar-metadata.xml
            
            # Library manifest
            echo '<?xml version="1.0" encoding="utf-8"?>' > build/flutter_webrtc/intermediates/library_manifest/release/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.cloudwebrtc.webrtc" />' >> build/flutter_webrtc/intermediates/library_manifest/release/AndroidManifest.xml
            
            # R file symbol table (package-aware-r.txt) - Must have valid format
            # Format: <package_name>:<resource_type>/<resource_name>
            # Even empty libraries need at least the package declaration
            echo 'com.cloudwebrtc.webrtc' > build/flutter_webrtc/intermediates/symbol_list_with_package_name/release/generateReleaseRFile/package-aware-r.txt
            
            # workmanager stubs
            mkdir -p build/workmanager/intermediates/merged_manifest/release/processReleaseManifest
            mkdir -p build/workmanager/intermediates/navigation_json/release/extractDeepLinksRelease
            mkdir -p build/workmanager/intermediates/aar_metadata/release
            mkdir -p build/workmanager/intermediates/library_manifest/release
            mkdir -p build/workmanager/intermediates/symbol_list_with_package_name/release/generateReleaseRFile
            
            echo '<?xml version="1.0" encoding="utf-8"?>' > build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="be.tramckrijte.workmanager">' >> build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            echo '    <application />' >> build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            echo '</manifest>' >> build/workmanager/intermediates/merged_manifest/release/processReleaseManifest/AndroidManifest.xml
            
            # FIXED: navigation.json must be an ARRAY
            echo '[]' > build/workmanager/intermediates/navigation_json/release/extractDeepLinksRelease/navigation.json
            
            # FIXED: Proper aar-metadata.xml format
            echo '<?xml version="1.0" encoding="utf-8"?>' > build/workmanager/intermediates/aar_metadata/release/aar-metadata.xml
            echo '<aar-metadata>' >> build/workmanager/intermediates/aar_metadata/release/aar-metadata.xml
            echo '  <minCompileSdk>21</minCompileSdk>' >> build/workmanager/intermediates/aar_metadata/release/aar-metadata.xml
            echo '</aar-metadata>' >> build/workmanager/intermediates/aar_metadata/release/aar-metadata.xml
            
            # Library manifest
            echo '<?xml version="1.0" encoding="utf-8"?>' > build/workmanager/intermediates/library_manifest/release/AndroidManifest.xml
            echo '<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="be.tramckrijte.workmanager" />' >> build/workmanager/intermediates/library_manifest/release/AndroidManifest.xml
            
            # R file symbol table (package-aware-r.txt) - Must have valid format
            echo 'be.tramckrijte.workmanager' > build/workmanager/intermediates/symbol_list_with_package_name/release/generateReleaseRFile/package-aware-r.txt
            
            echo "✅ Complete stub structure created for both plugins"
          }
          
          # Create stubs before first build
          create_stub_manifests
          
          # First attempt - FULL VERBOSE OUTPUT
          flutter build appbundle --release --split-debug-info=build/symbols --verbose 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build succeeded on first attempt"
            exit 0
          fi
          
          echo "⚠️ Build failed (exit code: $BUILD_EXIT_CODE), showing last 100 lines of build log:"
          tail -n 100 build.log || true
          
          echo "🔄 Performing deep clean and retry..."
          flutter clean
          rm -rf build/ .dart_tool/ android/.gradle android/app/build android/build || true
          cd android && ./gradlew clean --refresh-dependencies --stacktrace && cd ..
          flutter pub get
          
          # Recreate stubs after clean (they were deleted!)
          create_stub_manifests
          
          # Second attempt - FULL VERBOSE OUTPUT
          echo "🏗️ Retrying build after clean..."
          flutter build appbundle --release --split-debug-info=build/symbols --verbose 2>&1 | tee build-retry.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          
          if [ $BUILD_EXIT_CODE -eq 0 ]; then
            echo "✅ Build succeeded on retry"
            exit 0
          fi
          
          echo "❌ Build failed after retry (exit code: $BUILD_EXIT_CODE)"
          echo "📋 Last 200 lines of retry build log:"
          tail -n 200 build-retry.log || true
          exit 1

      - name: 🚚 Package AAB and mapping file
        run: |
          mkdir -p build/release
          version="${{ needs.increment-version.outputs.version }}"
          
          # Check if AAB file exists
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "❌ ERROR: AAB file not found at $AAB_PATH"
            echo "📋 Checking build directory structure:"
            find build -name "*.aab" -type f 2>/dev/null || echo "No AAB files found"
            echo "📋 Build directory contents:"
            ls -la build/app/outputs/bundle/release/ 2>/dev/null || echo "Release directory not found"
            echo "📋 Full build directory:"
            ls -la build/app/outputs/ 2>/dev/null || echo "Outputs directory not found"
            exit 1
          fi
          
          echo "✅ Found AAB file: $AAB_PATH"
          cp "$AAB_PATH" "build/release/LingAfriq-${version}.aab"
          echo "✅ Copied AAB to build/release/LingAfriq-${version}.aab"
          
          # Copy mapping.txt if it exists (generated by R8/ProGuard)
          if [ -f build/app/outputs/mapping/release/mapping.txt ]; then
            cp build/app/outputs/mapping/release/mapping.txt "build/release/mapping.txt"
            echo "✅ Found and copied mapping.txt file"
          else
            echo "⚠️ mapping.txt not found (check if minifyEnabled is true in build.gradle)"
          fi
          
          # Also copy symbols if they exist
          if [ -d build/symbols ]; then
            cp -r build/symbols "build/release/symbols" || true
            echo "✅ Copied symbols directory"
          fi
          
          echo "📦 Final artifacts in build/release/:"
          ls -lh build/release/

      - name: 📤 Upload AAB and mapping file
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.increment-version.outputs.version }}
          path: |
            build/release/LingAfriq-${{ needs.increment-version.outputs.version }}.aab
            build/release/mapping.txt
          if-no-files-found: warn

  build-ios:
    name: Build iOS IPA
    needs: increment-version
    runs-on: macos-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.increment-version.outputs.version }}
      version_name: ${{ needs.increment-version.outputs.version_name }}
      build_number: ${{ needs.increment-version.outputs.build_number }}

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: 🗑️ Remove flutter_webrtc plugin
        run: |
          chmod +x scripts/remove_webrtc_plugin.sh
          ./scripts/remove_webrtc_plugin.sh
          echo "✅ Removed flutter_webrtc from plugin registry"

      - name: 🔐 Setup iOS Code Signing
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          
          # Decode certificate and provisioning profile from secrets
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH
            echo "$PROVISIONING_PROFILE_BASE64" | base64 --decode > $PP_PATH
            
            # Create temporary keychain
            security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # Import certificate to keychain
            security import $CERTIFICATE_PATH -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH
            
            # Apply provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
          else
            echo "⚠️ No iOS signing credentials found. Building without signing (will need manual signing for App Store)"
          fi

      - name: 🔢 Update iOS version info
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          version_name="${{ needs.increment-version.outputs.version_name }}"
          build_number="${{ needs.increment-version.outputs.build_number }}"
          
          # Verify pubspec.yaml has the updated version
          current_version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          if [ "$current_version" != "$version" ]; then
            echo "⚠️ Version mismatch. Updating pubspec.yaml..."
            sed -i '' "s/^version: .*/version: $version/" pubspec.yaml
          fi
          
          # Update iOS project.pbxproj file
          # Update MARKETING_VERSION (version name)
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $version_name/g" ios/Runner.xcodeproj/project.pbxproj
          # Update CURRENT_PROJECT_VERSION (build number)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $build_number/g" ios/Runner.xcodeproj/project.pbxproj
          
          echo "📦 Updated iOS version: $version (build number: $build_number)"

      - name: 🍎 Install CocoaPods dependencies
        run: |
          cd ios
          # Remove Podfile.lock to force regeneration with correct Firebase versions
          rm -f Podfile.lock
          # Update CocoaPods repo and install dependencies (reduced verbosity)
          echo "📦 Updating CocoaPods repo..."
          pod repo update --silent
          echo "📦 Installing pods..."
          pod install --repo-update --silent
          cd ..

      - name: 🏗️ Build iOS Archive (Release)
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            # Build signed IPA (reduced verbosity - only show important messages)
            echo "🔐 Building signed IPA..."
            flutter build ipa --release --split-debug-info=build/symbols 2>&1 | grep -E "(Error|Warning|FAILURE|BUILD FAILED|Exception|✓|Built|Xcode build done)"
          else
            # Build archive without signing (for manual signing later)
            echo "⚠️ No signing credentials found. Building archive without signing..."
            echo "📝 Note: You'll need to sign manually in Xcode for App Store submission"
            flutter build ios --release --no-codesign --split-debug-info=build/symbols 2>&1 | grep -E "(Error|Warning|FAILURE|BUILD FAILED|Exception|✓|Built|Xcode build done)"
          fi

      - name: 🚚 Package iOS build with version
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.IOS_BUILD_CERTIFICATE_BASE64 }}
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          mkdir -p build/release/ios
          
          echo "🔎 Searching for iOS build artifacts..."
          echo "Checking build/ios/ipa/..."
          ls -la build/ios/ipa/ 2>/dev/null || echo "No ipa directory"
          echo "Checking build/ios/archive/..."
          ls -la build/ios/archive/ 2>/dev/null || echo "No archive directory"
          
          if [ -n "$BUILD_CERTIFICATE_BASE64" ]; then
            # Signed IPA exists
            ipa_file=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1)
            if [ -n "$ipa_file" ] && [ -f "$ipa_file" ]; then
              cp "$ipa_file" "build/release/ios/LingAfriq-$version.ipa"
              echo "✅ Signed IPA copied: build/release/ios/LingAfriq-$version.ipa"
            else
              echo "⚠️ IPA file not found in build/ios/ipa/, searching..."
              ipa_found=$(find build -name "*.ipa" -type f 2>/dev/null | head -n 1)
              if [ -n "$ipa_found" ] && [ -f "$ipa_found" ]; then
                cp "$ipa_found" "build/release/ios/LingAfriq-$version.ipa"
                echo "✅ IPA found and copied: $ipa_found"
              else
                echo "❌ No IPA file found anywhere"
              fi
            fi
          else
            # Archive without signing - create xcarchive zip
            if [ -d build/ios/archive/Runner.xcarchive ]; then
              cd build/ios/archive
              zip -r "../../../release/ios/LingAfriq-$version-unsigned.xcarchive.zip" Runner.xcarchive
              cd ../../..
              echo "✅ Unsigned archive created: build/release/ios/LingAfriq-$version-unsigned.xcarchive.zip"
            elif [ -d build/ios/archive ]; then
              cd build/ios/archive
              zip -r "../../../release/ios/LingAfriq-$version-unsigned.zip" .
              cd ../../..
              echo "✅ Archive packaged: build/release/ios/LingAfriq-$version-unsigned.zip"
            else
              echo "⚠️ Archive not found. Checking build directory..."
              find build -name "*.xcarchive" -type d || echo "No xcarchive found"
              find build -name "*.ipa" -type f || echo "No IPA found"
            fi
          fi
          
          echo "📦 Final iOS artifacts in build/release/ios/:"
          ls -lh build/release/ios/ || echo "No files found"

      - name: 📤 Upload iOS build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ needs.increment-version.outputs.version }}
          path: build/release/ios/
          if-no-files-found: warn
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android AAB and mapping file
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ needs.build-android.outputs.version }}
          path: build/release/android

      - name: 📥 Download iOS IPA/Archive
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-build-${{ needs.build-ios.outputs.version }}
          path: build/release/ios

      - name: 🏷️ Extract version info
        id: version
        run: |
          version="${{ needs.build-android.outputs.version }}"
          version_name="${{ needs.build-android.outputs.version_name }}"
          build_number="${{ needs.build-android.outputs.build_number }}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "version_name=$version_name" >> $GITHUB_OUTPUT
          echo "build_number=$build_number" >> $GITHUB_OUTPUT

      - name: 📋 Check available artifacts
        id: check-artifacts
        run: |
          mkdir -p build/release/android build/release/ios
          echo "Checking for Android AAB..."
          if ls build/release/android/*.aab 2>/dev/null; then
            echo "android_exists=true" >> $GITHUB_OUTPUT
            ls -lh build/release/android/
          else
            echo "android_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ Android AAB not found"
          fi
          
          echo "Checking for iOS artifacts..."
          if ls build/release/ios/*.ipa build/release/ios/*.zip 2>/dev/null; then
            echo "ios_exists=true" >> $GITHUB_OUTPUT
            ls -lh build/release/ios/
          else
            echo "ios_exists=false" >> $GITHUB_OUTPUT
            echo "⚠️ iOS artifacts not found"
          fi

      - name: 🏁 Create GitHub Release
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          name: "LingAfriq v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: |
            build/release/android/*.aab
            build/release/android/mapping.txt
            build/release/ios/*.ipa
            build/release/ios/*.zip
            build/release/ios/*.xcarchive.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
