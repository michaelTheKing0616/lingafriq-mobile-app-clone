name: Build and Release iOS & Android

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  increment-version:
    name: Increment Version Number
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.increment.outputs.version }}
      version_name: ${{ steps.increment.outputs.version_name }}
      build_number: ${{ steps.increment.outputs.build_number }}
    
    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🔢 Increment build number
        id: increment
        run: |
          # Extract current version from pubspec.yaml
          # The part before + (marketing / CFBundleShortVersionString) must stay STRICTLY above the latest
          # version ever approved on the App Store, or TestFlight upload fails with 409 (train closed / invalid version).
          # This job only bumps the build number after +; raise the marketing version in pubspec when Apple approves a release.
          current_version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          version_name=$(echo $current_version | cut -d'+' -f1)
          build_number=$(echo $current_version | cut -d'+' -f2)
          
          # Ensure build number is at least 91 (last prod was 90)
          # If current build is less than 91, set to 91, otherwise increment
          if [ "$build_number" -lt 91 ]; then
            echo "⚠️ Build number $build_number is less than 91. Setting to 91."
            build_number=91
          elif [ "$build_number" -eq 90 ]; then
            echo "📦 Current build is 90, incrementing to 91."
            build_number=91
          else
            # Increment build number
            build_number=$((build_number + 1))
          fi
          
          new_version="${version_name}+${build_number}"
          
          # Update pubspec.yaml
          sed -i "s/^version: .*/version: $new_version/" pubspec.yaml
          
          echo "version=$new_version" >> $GITHUB_OUTPUT
          echo "version_name=$version_name" >> $GITHUB_OUTPUT
          echo "build_number=$build_number" >> $GITHUB_OUTPUT
          echo "📦 Updated version: $new_version (build number: $build_number)"

      - name: 💾 Commit version update
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add pubspec.yaml
          git commit -m "chore: auto-increment build number to ${{ steps.increment.outputs.version }}" || echo "No changes to commit"
          # Downstream jobs checkout main; if push fails they would build the old marketing version and TestFlight rejects (409).
          git push

  build-android:
    name: Build Android App Bundle
    needs: increment-version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ needs.increment-version.outputs.version }}
      version_name: ${{ needs.increment-version.outputs.version_name }}
      build_number: ${{ needs.increment-version.outputs.build_number }}

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🔧 Ensure Gradle wrapper is executable
        run: |
          chmod +x android/gradlew || true

      - name: 🧰 Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: 🔧 Install CMake (required for rive_common native builds)
        run: sudo apt-get update && sudo apt-get install -y cmake

      - name: 🛠️ Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/tools/bin" >> $GITHUB_PATH

      - name: 🧹 Clean corrupted NDK installations
        run: |
          if [ -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ] && [ ! -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties" ]; then
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.0.12077973"
          fi

      - name: 🧩 Install Android SDK components
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: Verify X feed route files exist
        run: |
          set -e
          for f in x_feed_home_screen x_compose_screen x_post_detail_screen x_explore_screen x_lists_screen x_profile_screen; do
            p="lib/screens/feed/${f}.dart"
            if [ ! -f "$p" ]; then echo "Missing required file: $p (checkout may be stale or PR branch incomplete)"; exit 1; fi
          done

      - name: Flutter analyze
        run: |
          echo "🔍 Running Flutter analyze..."
          # Default flutter analyze treats infos/warnings as fatal; CI should fail only on errors.
          flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "✅ Flutter analyze passed"

      - name: i18n literal gate
        run: dart run tool/i18n_gate.dart

      - name: Flutter test (with coverage)
        run: |
          echo "🧪 Running Flutter tests with coverage..."
          flutter test --coverage
          echo "✅ Flutter tests passed"

      - name: Coverage summary (lcov)
        if: success()
        run: |
          if [ -f coverage/lcov.info ]; then
            sudo apt-get update -qq && sudo apt-get install -y lcov
            lcov --summary coverage/lcov.info
          else
            echo "No coverage/lcov.info produced"
            exit 1
          fi

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-android
          path: coverage/
          retention-days: 14

      - name: 🔢 Use incremented version
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          echo "📦 Using version: $version"
          grep "version: $version" pubspec.yaml || echo "⚠️ Version mismatch in pubspec.yaml"

      - name: 🔑 Setup signing key
        run: |
          echo "Decoding keystore..."
          mkdir -p android/app
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          echo "Creating key.properties..."
          mkdir -p android
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      - name: 🧹 Comprehensive Cache Clearing (Before Build)
        run: |
          flutter clean || true
          flutter pub cache repair || true
          rm -rf build/ .dart_tool/ .flutter-plugins .flutter-plugins-dependencies .packages || true
          chmod +x android/gradlew || true
          cd android && ./gradlew clean --refresh-dependencies -q && cd .. || true
          rm -rf ~/.gradle/caches/modules-2/files-2.1 ~/.gradle/caches/transforms-* ~/.gradle/daemon || true
          rm -rf android/.gradle android/app/build android/build || true
          if [ -n "$ANDROID_SDK_ROOT" ] && [ -d "$ANDROID_SDK_ROOT/ndk/27.0.12077973" ] && [ ! -f "$ANDROID_SDK_ROOT/ndk/27.0.12077973/source.properties" ]; then
            rm -rf "$ANDROID_SDK_ROOT/ndk/27.0.12077973" || true
          fi
          rm -rf android/app/src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java \
            ios/Runner/GeneratedPluginRegistrant.m ios/Runner/GeneratedPluginRegistrant.h \
            .flutter-plugins .flutter-plugins-dependencies || true
          flutter pub get

      # Logs: normal build (no --verbose). On failure, only grep'd errors + last 80 lines to diagnose.
      - name: 🏗️ Build AAB (Release)
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.parallel=true -Dorg.gradle.caching=false -Dorg.gradle.console=plain"
          VERSION_NAME: ${{ needs.increment-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.increment-version.outputs.build_number }}
        run: |
          set +e
          chmod +x android/gradlew || true
          flutter build appbundle --release --split-debug-info=build/symbols \
            --dart-define=CERTIFICATE_PIN_HASHES="${{ secrets.CERTIFICATE_PIN_HASHES }}" \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" 2>&1 | tee build.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -eq 0 ]; then echo "Build succeeded"; exit 0; fi

          echo "=== Build failed: compile/build errors (grep) ==="
          grep -E "Error:|Error |FAILED|FAILURE|fatal:|Exception|lib/.*\.dart:[0-9]+|Not found:|Couldn't resolve" build.log || true
          echo "=== Last 80 lines (context) ==="
          tail -n 80 build.log || true

          echo "Deep clean and retry..."
          flutter clean
          rm -rf build/ .dart_tool/ android/.gradle android/app/build android/build || true
          chmod +x android/gradlew || true
          (cd android && ./gradlew clean --refresh-dependencies --stacktrace 2>&1 | tail -20) || true
          flutter pub get

          flutter build appbundle --release --split-debug-info=build/symbols \
            --dart-define=CERTIFICATE_PIN_HASHES="${{ secrets.CERTIFICATE_PIN_HASHES }}" \
            --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" 2>&1 | tee build-retry.log
          BUILD_EXIT_CODE=${PIPESTATUS[0]}
          if [ $BUILD_EXIT_CODE -eq 0 ]; then echo "Build succeeded on retry"; exit 0; fi

          echo "=== Retry failed: compile/build errors (grep) ==="
          grep -E "Error:|Error |FAILED|FAILURE|fatal:|Exception|lib/.*\.dart:[0-9]+|Not found:|Couldn't resolve" build-retry.log || true
          echo "=== Last 80 lines (context) ==="
          tail -n 80 build-retry.log || true
          exit 1

      - name: 🚚 Package AAB and mapping file
        run: |
          mkdir -p build/release
          version="${{ needs.increment-version.outputs.version }}"
          AAB_PATH="build/app/outputs/bundle/release/app-release.aab"
          if [ ! -f "$AAB_PATH" ]; then
            echo "ERROR: AAB not found at $AAB_PATH"
            find build -name "*.aab" 2>/dev/null || true
            ls -la build/app/outputs/bundle/release/ 2>/dev/null || true
            exit 1
          fi
          cp "$AAB_PATH" "build/release/LingAfriq-${version}.aab"
          [ -f build/app/outputs/mapping/release/mapping.txt ] && cp build/app/outputs/mapping/release/mapping.txt build/release/mapping.txt || true
          [ -d build/symbols ] && cp -r build/symbols build/release/ || true

      - name: 📤 Upload AAB and mapping file
        uses: actions/upload-artifact@v4
        with:
          name: android-aab-${{ needs.increment-version.outputs.version }}
          path: |
            build/release/LingAfriq-${{ needs.increment-version.outputs.version }}.aab
            build/release/mapping.txt
          if-no-files-found: warn

  build-ios:
    name: Build iOS IPA
    needs: increment-version
    # iOS 26 SDK (Xcode 26+) required for App Store uploads after 2026-04-28; macos-26 images include it.
    runs-on: macos-26
    permissions:
      contents: write
    outputs:
      version: ${{ needs.increment-version.outputs.version }}
      version_name: ${{ needs.increment-version.outputs.version_name }}
      build_number: ${{ needs.increment-version.outputs.build_number }}

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: 🐦 Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.0'

      - name: 📦 Get Flutter dependencies
        run: flutter pub get

      - name: Verify X feed route files exist
        run: |
          set -e
          for f in x_feed_home_screen x_compose_screen x_post_detail_screen x_explore_screen x_lists_screen x_profile_screen; do
            p="lib/screens/feed/${f}.dart"
            if [ ! -f "$p" ]; then echo "Missing required file: $p"; exit 1; fi
          done

      - name: Flutter analyze
        run: |
          echo "🔍 Running Flutter analyze..."
          flutter analyze --no-fatal-infos --no-fatal-warnings
          echo "✅ Flutter analyze passed"

      - name: i18n literal gate
        run: dart run tool/i18n_gate.dart

      - name: Flutter test (with coverage)
        run: |
          echo "🧪 Running Flutter tests with coverage..."
          flutter test --coverage
          echo "✅ Flutter tests passed"

      - name: Coverage summary (lcov)
        if: success()
        run: |
          if [ ! -f coverage/lcov.info ]; then
            echo "No coverage/lcov.info produced"
            exit 1
          fi
          if ! command -v lcov >/dev/null 2>&1; then
            brew install lcov
          fi
          lcov --summary coverage/lcov.info

      - name: Upload coverage artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ios
          path: coverage/
          retention-days: 14

      - name: 🔐 Setup iOS Code Signing
        env:
          IOS_P12: ${{ secrets.IOS_P12 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE: ${{ secrets.IOS_PROFILE }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create variables
          CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
          PP_PATH=$RUNNER_TEMP/build_pp.mobileprovision
          PROFILE_PLIST_PATH=$RUNNER_TEMP/profile.plist
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          EFFECTIVE_KEYCHAIN_PASSWORD=${KEYCHAIN_PASSWORD:-temp_keychain_password}
          
          # Decode certificate and provisioning profile from secrets
          if [ -n "$IOS_P12" ] && [ -n "$IOS_P12_PASSWORD" ] && [ -n "$IOS_PROFILE" ]; then
            echo "$IOS_P12" | base64 --decode > $CERTIFICATE_PATH
            echo "$IOS_PROFILE" | base64 --decode > $PP_PATH
            
            # Create temporary keychain
            security create-keychain -p "$EFFECTIVE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
            security unlock-keychain -p "$EFFECTIVE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            
            # Import certificate to keychain
            security import $CERTIFICATE_PATH -P "$IOS_P12_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
            security set-key-partition-list -S apple-tool:,apple: -s -k "$EFFECTIVE_KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
            security list-keychain -d user -s $KEYCHAIN_PATH login.keychain-db
            security default-keychain -s $KEYCHAIN_PATH
            
            # Apply provisioning profile
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles
            security cms -D -i $PP_PATH > $PROFILE_PLIST_PATH

            IOS_PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" $PROFILE_PLIST_PATH)
            IOS_PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print :UUID" $PROFILE_PLIST_PATH)
            IOS_TEAM_ID=$(/usr/libexec/PlistBuddy -c "Print :TeamIdentifier:0" $PROFILE_PLIST_PATH)

            cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/$IOS_PROFILE_UUID.mobileprovision

            echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> $GITHUB_ENV
            echo "IOS_PROFILE_NAME=$IOS_PROFILE_NAME" >> $GITHUB_ENV
            echo "IOS_PROFILE_UUID=$IOS_PROFILE_UUID" >> $GITHUB_ENV
            echo "IOS_TEAM_ID=$IOS_TEAM_ID" >> $GITHUB_ENV
            echo "IOS_SIGNING_READY=true" >> $GITHUB_ENV
          else
            echo "⚠️ No iOS signing credentials found. Building without signing (will need manual signing for App Store)"
            echo "IOS_SIGNING_READY=false" >> $GITHUB_ENV
          fi

      - name: 🔢 Update iOS version info
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          version_name="${{ needs.increment-version.outputs.version_name }}"
          build_number="${{ needs.increment-version.outputs.build_number }}"
          
          # Verify pubspec.yaml has the updated version
          current_version=$(grep '^version:' pubspec.yaml | sed 's/version: //')
          if [ "$current_version" != "$version" ]; then
            echo "⚠️ Version mismatch. Updating pubspec.yaml..."
            sed -i '' "s/^version: .*/version: $version/" pubspec.yaml
          fi
          
          # Update iOS project.pbxproj file
          # Update MARKETING_VERSION (version name)
          sed -i '' "s/MARKETING_VERSION = [^;]*/MARKETING_VERSION = $version_name/g" ios/Runner.xcodeproj/project.pbxproj
          # Update CURRENT_PROJECT_VERSION (build number)
          sed -i '' "s/CURRENT_PROJECT_VERSION = [^;]*/CURRENT_PROJECT_VERSION = $build_number/g" ios/Runner.xcodeproj/project.pbxproj
          
          echo "📦 Updated iOS version: $version (build number: $build_number)"

      - name: 🧾 Generate ExportOptions.plist for manual signing
        if: env.IOS_SIGNING_READY == 'true'
        run: |
          IOS_BUNDLE_ID=$(xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -showBuildSettings | awk '/PRODUCT_BUNDLE_IDENTIFIER/ {print $3}' | tail -n 1)
          if [ -z "$IOS_BUNDLE_ID" ]; then
            IOS_BUNDLE_ID="com.owlab.lingafriq"
          fi
          echo "IOS_BUNDLE_ID=$IOS_BUNDLE_ID" >> $GITHUB_ENV

          cat > ios/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>teamID</key>
              <string>$IOS_TEAM_ID</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>$IOS_BUNDLE_ID</key>
                  <string>$IOS_PROFILE_NAME</string>
              </dict>
          </dict>
          </plist>
          EOF

      # WebRTC-SDK (flutter_webrtc / LiveKit) downloads a large zip from GitHub Releases.
      # Transient 502s from GitHub are common; retry + keep Podfile.lock for reproducible resolves.
      - name: 🍎 Install CocoaPods dependencies
        run: |
          set -e
          cd ios
          max=5
          attempt=1
          did_firebase_coreonly_update=0
          did_firebase_messaging_update=0
          while [ "$attempt" -le "$max" ]; do
            echo "📦 pod install attempt $attempt/$max"
            if [ "$attempt" -eq 1 ]; then
              echo "📦 Updating CocoaPods repo..."
              pod repo update --silent || true
            fi
            set +e
            POD_OUTPUT="$(pod install --repo-update --silent 2>&1)"
            POD_EXIT_CODE=$?
            set -e
            if [ "$POD_EXIT_CODE" -eq 0 ]; then
              echo "✅ CocoaPods install succeeded"
              cd ..
              exit 0
            fi

            # If firebase_core plugin updated its Firebase iOS SDK constraints, Podfile.lock can pin an older Firebase/CoreOnly.
            # Heal by updating that pod once, then retry install.
            if [ "$did_firebase_coreonly_update" -eq 0 ] && echo "$POD_OUTPUT" | grep -q "Firebase/CoreOnly" && echo "$POD_OUTPUT" | grep -q "In snapshot (Podfile.lock)"; then
              echo "🧯 Detected Firebase/CoreOnly lock mismatch. Running: pod update Firebase/CoreOnly"
              did_firebase_coreonly_update=1
              pod update Firebase/CoreOnly --silent || true
              # Retry immediately (no sleep)
              attempt=$((attempt + 1))
              continue
            fi

            # firebase_messaging major bumps pin Firebase/Messaging to the SDK version from firebase_core (e.g. 12.4.0); stale Podfile.lock can still reference 11.x.
            if [ "$did_firebase_messaging_update" -eq 0 ] && echo "$POD_OUTPUT" | grep -q "Firebase/Messaging" && echo "$POD_OUTPUT" | grep -q "In snapshot (Podfile.lock)"; then
              echo "🧯 Detected Firebase/Messaging lock mismatch. Running: pod update Firebase/Messaging (and CoreOnly if needed)"
              did_firebase_messaging_update=1
              pod update Firebase/Messaging Firebase/CoreOnly --silent || pod update Firebase/Messaging --silent || true
              attempt=$((attempt + 1))
              continue
            fi

            if [ "$attempt" -eq "$max" ]; then
              echo "$POD_OUTPUT"
              echo "❌ pod install failed after $max attempts (CocoaPods lock skew, CDN/curl 502, GitHub 502 on WebRTC.xcframework.zip, etc.)"
              cd ..
              exit 1
            fi
            echo "$POD_OUTPUT"
            wait=$((attempt * 40))
            echo "⏳ Network/CDN flake (curl 502, etc.). Sleeping ${wait}s before retry..."
            sleep "$wait"
            attempt=$((attempt + 1))
          done

      # Do NOT pass PROVISIONING_PROFILE_SPECIFIER / CODE_SIGN_STYLE on xcodebuild CLI — it applies to every Pod
      # target and breaks archive ("does not support provisioning profiles"). Only Runner must be manual-signed.
      - name: 🔏 Apply manual signing to Runner Release only
        if: env.IOS_SIGNING_READY == 'true'
        env:
          IOS_TEAM_ID: ${{ env.IOS_TEAM_ID }}
          IOS_PROFILE_NAME: ${{ env.IOS_PROFILE_NAME }}
        run: |
          python3 << 'PY'
          import os
          import re

          path = "ios/Runner.xcodeproj/project.pbxproj"
          team = os.environ["IOS_TEAM_ID"].strip()
          profile = os.environ["IOS_PROFILE_NAME"].strip().replace("\\", "\\\\").replace('"', '\\"')

          text = open(path, encoding="utf-8").read()
          marker = "97C147071CF9000F007C117D /* Release */ = {"
          start = text.find(marker)
          if start < 0:
              raise SystemExit("Runner Release configuration block not found in project.pbxproj")

          name_idx = text.find("name = Release;", start)
          if name_idx < 0:
              raise SystemExit("Could not find end of Runner Release block")

          chunk = text[start:name_idx]
          chunk = chunk.replace(
              'CODE_SIGN_IDENTITY = "Apple Development";',
              'CODE_SIGN_IDENTITY = "Apple Distribution";\n\t\t\t\t"CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "Apple Distribution";',
              1,
          )
          chunk = chunk.replace("CODE_SIGN_STYLE = Automatic;", "CODE_SIGN_STYLE = Manual;", 1)
          chunk = chunk.replace(
              'PROVISIONING_PROFILE_SPECIFIER = "";',
              f'PROVISIONING_PROFILE_SPECIFIER = "{profile}";',
              1,
          )
          chunk = re.sub(
              r"DEVELOPMENT_TEAM = [^;]+;",
              f"DEVELOPMENT_TEAM = {team};",
              chunk,
              count=1,
          )

          new_text = text[:start] + chunk + text[name_idx:]
          open(path, "w", encoding="utf-8", newline="\n").write(new_text)
          print("Patched Runner Release for manual signing (profile + team in pbxproj only).")
          PY

      # Logs: full output to build-ios.log. On failure, only grep'd errors + last 80 lines.
      - name: 🏗️ Build iOS Archive (Release)
        env:
          IOS_P12: ${{ secrets.IOS_P12 }}
          VERSION_NAME: ${{ needs.increment-version.outputs.version_name }}
          BUILD_NUMBER: ${{ needs.increment-version.outputs.build_number }}
        run: |
          set -o pipefail
          set +e
          if [ "$IOS_SIGNING_READY" = "true" ] && [ -n "$IOS_P12" ]; then
            flutter build ios --release --no-codesign --split-debug-info=build/symbols \
              --dart-define=CERTIFICATE_PIN_HASHES="${{ secrets.CERTIFICATE_PIN_HASHES }}" \
              --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" 2>&1 | tee build-ios.log
            build_code=${PIPESTATUS[0]}
            if [ $build_code -eq 0 ]; then
              xcodebuild -workspace ios/Runner.xcworkspace \
                -scheme Runner \
                -configuration Release \
                -destination 'generic/platform=iOS' \
                -archivePath $PWD/build/ios/archive/Runner.xcarchive \
                OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" \
                archive 2>&1 | tee -a build-ios.log
              archive_code=${PIPESTATUS[0]}
              if [ $archive_code -eq 0 ]; then
                xcodebuild -exportArchive \
                  -archivePath $PWD/build/ios/archive/Runner.xcarchive \
                  -exportOptionsPlist ios/ExportOptions.plist \
                  -exportPath $PWD/build/ios/ipa \
                  OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN_PATH" 2>&1 | tee -a build-ios.log
                code=${PIPESTATUS[0]}
              else
                code=$archive_code
              fi
            else
              code=$build_code
            fi
          else
            flutter build ios --release --no-codesign --split-debug-info=build/symbols \
              --dart-define=CERTIFICATE_PIN_HASHES="${{ secrets.CERTIFICATE_PIN_HASHES }}" \
              --build-name="$VERSION_NAME" --build-number="$BUILD_NUMBER" 2>&1 | tee build-ios.log
            code=${PIPESTATUS[0]}
          fi
          if [ $code -eq 0 ]; then echo "Build succeeded"; exit 0; fi
          echo "=== Build failed: compile/build errors (grep) ==="
          grep -E "Error|error:|FAILURE|BUILD FAILED|Exception|fatal:|\.dart:[0-9]+|Not found|Couldn't resolve" build-ios.log || true
          echo "=== Last 80 lines (context) ==="
          tail -n 80 build-ios.log || true
          exit $code

      - name: 🚚 Package iOS build with version
        env:
          IOS_P12: ${{ secrets.IOS_P12 }}
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          mkdir -p build/release/ios
          if [ "$IOS_SIGNING_READY" = "true" ] && [ -n "$IOS_P12" ]; then
            ipa_file=$(ls build/ios/ipa/*.ipa 2>/dev/null | head -n 1)
            if [ -n "$ipa_file" ] && [ -f "$ipa_file" ]; then
              cp "$ipa_file" "build/release/ios/LingAfriq-$version.ipa"
            else
              ipa_found=$(find build -name "*.ipa" -type f 2>/dev/null | head -n 1)
              if [ -n "$ipa_found" ] && [ -f "$ipa_found" ]; then
                cp "$ipa_found" "build/release/ios/LingAfriq-$version.ipa"
              else
                echo "⚠️ Signed build path enabled, but no IPA was found under build/. Skipping IPA copy."
              fi
            fi
          else
            if [ -d build/ios/archive/Runner.xcarchive ]; then
              (cd build/ios/archive && zip -r "../../../release/ios/LingAfriq-$version-unsigned.xcarchive.zip" Runner.xcarchive)
            elif [ -d build/ios/archive ]; then
              (cd build/ios/archive && zip -r "../../../release/ios/LingAfriq-$version-unsigned.zip" .)
            else
              echo "⚠️ No unsigned iOS archive directory found. Nothing to package."
            fi
          fi

      - name: 📤 Upload iOS build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-${{ needs.increment-version.outputs.version }}
          path: build/release/ios/
          if-no-files-found: warn
          retention-days: 30

      # App Store Connect API (p8 + Key ID + Issuer ID). Secrets: APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID
      # Note: pilot only accepts --api_key_path (JSON) or --api-key (JSON). PEM must not be passed as APP_STORE_CONNECT_API_KEY env while running fastlane (Pilot maps that env to api_key hash).
      #
      # If pilot fails with "A required agreement is missing or has expired", that is NOT a code/signing bug:
      # the Account Holder must open App Store Connect → Agreements, Tax, and Banking and accept pending agreements,
      # then re-run this workflow. See: https://developer.apple.com/help/app-store-connect/manage-agreements/sign-and-update-agreements
      #
      # Until then, you may set repository secret SKIP_TESTFLIGHT_UPLOAD=true so this step exits 0 and the workflow
      # stays green; delete the secret after agreements are active to resume uploads.
      - name: 🚀 Upload IPA to TestFlight (App Store Connect API)
        if: >
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ASC_API_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          SKIP_TESTFLIGHT_UPLOAD: ${{ secrets.SKIP_TESTFLIGHT_UPLOAD }}
        run: |
          set -euo pipefail
          case "${SKIP_TESTFLIGHT_UPLOAD:-}" in
            true|TRUE)
              echo "::notice::Skipping TestFlight upload (secret SKIP_TESTFLIGHT_UPLOAD is true). IPA remains in artifacts. Remove this secret after App Store Connect agreements are accepted."
              exit 0
              ;;
          esac
          if [ "${IOS_SIGNING_READY:-false}" != "true" ]; then
            echo "Skipping TestFlight: iOS signing credentials not available (IOS_SIGNING_READY=false)."
            exit 0
          fi
          version="${{ needs.increment-version.outputs.version }}"
          IPA="build/release/ios/LingAfriq-${version}.ipa"
          if [ ! -f "$IPA" ]; then
            echo "::error::Expected signed IPA at $IPA but file is missing. Fix archive/export before TestFlight upload."
            exit 1
          fi
          if [ -z "${ASC_API_PRIVATE_KEY:-}" ] || [ -z "${APP_STORE_CONNECT_KEY_ID:-}" ] || [ -z "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            echo "::error::TestFlight upload skipped: set secrets APP_STORE_CONNECT_API_KEY, APP_STORE_CONNECT_KEY_ID, and APP_STORE_CONNECT_ISSUER_ID in repo Settings → Secrets."
            exit 1
          fi
          export LC_ALL=en_US.UTF-8
          export LANG=en_US.UTF-8
          sudo gem install fastlane --no-document
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          JSON_PATH="$RUNNER_TEMP/api_key_info.json"
          printf '%s\n' "$ASC_API_PRIVATE_KEY" | tr -d '\r' > "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          jq -n \
            --arg key_id "$APP_STORE_CONNECT_KEY_ID" \
            --arg issuer_id "$APP_STORE_CONNECT_ISSUER_ID" \
            --rawfile key "$KEY_PATH" \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key}' > "$JSON_PATH"
          set +e
          fastlane pilot upload \
            --ipa "$IPA" \
            --api_key_path "$JSON_PATH" \
            --skip_waiting_for_build_processing \
            --skip_submission 2>&1 | tee pilot-upload.log
          PILOT_EXIT=${PIPESTATUS[0]}
          set -e
          rm -f "$KEY_PATH" "$JSON_PATH"
          if [ "$PILOT_EXIT" -ne 0 ]; then
            if grep -qiE 'agreement is missing|agreement.*expired|required agreement' pilot-upload.log 2>/dev/null; then
              echo "::error::App Store Connect blocked the upload until pending legal agreements are accepted. As Account Holder (or Admin), open https://appstoreconnect.apple.com → Agreements, Tax, and Banking → accept all items, then re-run this job. Docs: https://developer.apple.com/help/app-store-connect/manage-agreements/sign-and-update-agreements"
            fi
            exit "$PILOT_EXIT"
          fi
          echo "✅ IPA submitted to App Store Connect; processing continues in App Store Connect → TestFlight."

  create-release:
    name: Create GitHub Release
    needs: [increment-version, build-android, build-ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: always()

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📥 Download Android AAB and mapping file
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: android-aab-${{ needs.increment-version.outputs.version }}
          path: build/release/android

      - name: 📥 Download iOS IPA/Archive
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: ios-build-${{ needs.increment-version.outputs.version }}
          path: build/release/ios

      - name: 🏷️ Extract version info
        id: version
        run: |
          version="${{ needs.increment-version.outputs.version }}"
          version_name="${{ needs.increment-version.outputs.version_name }}"
          build_number="${{ needs.increment-version.outputs.build_number }}"
          echo "version=$version" >> $GITHUB_OUTPUT
          echo "version_name=$version_name" >> $GITHUB_OUTPUT
          echo "build_number=$build_number" >> $GITHUB_OUTPUT

      - name: 📋 Check available artifacts
        id: check-artifacts
        run: |
          mkdir -p build/release/android build/release/ios
          ls build/release/android/*.aab 2>/dev/null && echo "android_exists=true" >> $GITHUB_OUTPUT || echo "android_exists=false" >> $GITHUB_OUTPUT
          ls build/release/ios/*.ipa build/release/ios/*.zip build/release/ios/*.xcarchive.zip 2>/dev/null && echo "ios_exists=true" >> $GITHUB_OUTPUT || echo "ios_exists=false" >> $GITHUB_OUTPUT
          if ls build/release/android/*.aab build/release/ios/*.ipa build/release/ios/*.zip build/release/ios/*.xcarchive.zip >/dev/null 2>&1; then
            echo "has_artifacts=true" >> $GITHUB_OUTPUT
          else
            echo "has_artifacts=false" >> $GITHUB_OUTPUT
          fi

      - name: ℹ️ Skip empty release
        if: steps.check-artifacts.outputs.has_artifacts != 'true'
        run: echo "No Android/iOS artifacts found. Skipping release creation."

      - name: 🏁 Create GitHub Release
        if: steps.check-artifacts.outputs.has_artifacts == 'true'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          name: "LingAfriq v${{ steps.version.outputs.version }}"
          tag_name: "v${{ steps.version.outputs.version }}"
          files: |
            build/release/android/*.aab
            build/release/android/mapping.txt
            build/release/ios/*.ipa
            build/release/ios/*.zip
            build/release/ios/*.xcarchive.zip
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
