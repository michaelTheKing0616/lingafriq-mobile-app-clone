name: agent-files

on:
  pull_request:
    paths:
      - '.cursor/**'
      - 'AGENTS.md'
      - 'docs/build/**'
      - 'scripts/check_agent_files.py'
      - '.githooks/**'
      - '.github/workflows/agent-files.yml'
  push:
    branches: [main, cloud-handoff]
    paths:
      - '.cursor/**'
      - 'AGENTS.md'
      - 'docs/build/**'
      - 'scripts/check_agent_files.py'
      - '.githooks/**'
      - '.github/workflows/agent-files.yml'
  workflow_dispatch:

jobs:
  agent-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Charter marker on changed agent-facing files
        run: |
          BASE="${{ github.event.pull_request.base.ref || 'main' }}"
          git fetch origin "$BASE" --depth=1 2>/dev/null || true
          python3 scripts/check_agent_files.py --diff "origin/${BASE}"
