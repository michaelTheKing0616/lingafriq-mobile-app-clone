name: LLM Authoring

on:
  pull_request:
  push:
    branches: [main, master, develop]

jobs:
  ai-eval-gate:
    name: AI eval gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Eval gate tests
        run: python3 test/ci/ai_eval_gate_test.py

      - name: Block a prompt or model change without a passing eval
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        run: python3 scripts/ci/ai_eval_gate.py

  review-checks:
    name: Authoring review checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch the pull request base
        if: github.event_name == 'pull_request'
        run: git fetch --no-tags origin "${{ github.base_ref }}"

      - name: Authoring paths in this change
        id: hit
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="origin/${{ github.base_ref }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="HEAD~1"
          fi
          if git diff --name-only "$base"...HEAD | grep -E '^(tools/llm_authoring/|tools/content_data/|assets/data/)'; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "skipped: no authoring path change"
          fi

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.hit.outputs.hit == 'true'
        with:
          python-version: "3.11"

      - name: Install authoring dependencies
        if: steps.hit.outputs.hit == 'true'
        run: pip install requests

      - name: Run review_checks on draft directories
        if: steps.hit.outputs.hit == 'true'
        run: |
          set -e
          shopt -s nullglob
          found=0
          for f in $(find tools/llm_authoring/drafts -name '*.json' -type f 2>/dev/null); do
            echo "Checking $f"
            python -m tools.llm_authoring.review_checks "$f" --strict
            found=1
          done
          if [ "$found" -eq 0 ]; then
            echo "No draft JSON in this change — review_checks module OK"
            python -c "from tools.llm_authoring import review_checks; print('import ok')"
          fi

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: steps.hit.outputs.hit == 'true'
        with:
          flutter-version: "3.35.0"
          channel: stable

      - name: Validate content schemas
        if: steps.hit.outputs.hit == 'true'
        run: dart run tool/validate_content_schemas.dart
