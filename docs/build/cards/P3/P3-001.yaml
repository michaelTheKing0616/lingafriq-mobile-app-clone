acceptance_criteria:
- id: AC1
  text: Given a cap of 12 web searches total, when the benchmark runs on Duolingo plus Speak, Babbel and Memrise, then docs/build/design/BENCHMARK.md
    lists the queries used and stops at the cap
- id: AC2
  text: Given each product, when measured, then BENCHMARK.md holds >=12 numeric baselines (taps to first lesson, seconds to
    first spoken output, onboarding step count, min text sp, feedback latency ms) each with value, unit, source and date
- id: AC3
  text: Given a baseline without a primary source, when recorded, then it carries the [Unverified] tag and no number is invented
- id: AC4
  text: Given docs/build/benchmark/ exists, when screenshots are cited, then only files from that folder are used; if absent,
    entries say no-screenshot
- id: AC5
  text: Given the baselines, when G3 is reviewed, then every later UX or UI Scorecard target cites the baseline row it must
    meet or beat
