acceptance_criteria:
- id: AC1
  text: Given the hub Village, when the learner opens it, then the entry point leads to /village/chat-search, /village/contact-info,
    /village/moderation, /village/chat-welcome and each route is registered in my_app.dart
- id: AC2
  text: Given the screen has no data, when it opens, then the empty state shows; given a load error, then the error state
    shows and no stale data renders
- id: AC3
  text: Given the reachability scan from lib/main.dart, when it runs, then every revived screen is reachable from the shell
- id: AC4
  text: Given Contact Info, when Block or Report is tapped, then the action completes server-side and a failure shows a retry
    state
- id: AC5
  text: Given Moderation Tools, when a non-moderator opens it, then access is denied with a typed error
- id: AC6
  text: Given Chat Welcome, when a chat is first opened, then the guidelines show once and acceptance is recorded
- id: AC7
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
