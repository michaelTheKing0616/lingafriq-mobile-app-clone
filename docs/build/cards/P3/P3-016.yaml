acceptance_criteria:
- id: AC1
  text: Given the Tone Lens, when drawn, then H, M, L, rising, falling and downstep contours are distinct in greyscale and
    colour is optional
- id: AC2
  text: Given pronunciation feedback, when drawn, then it includes an unsure state and uses sample data labelled as sample
    with no invented precision number
- id: AC3
  text: Given Word Card and Lens camera, when drawn, then the Word Card opens from a long-press on any word and the Lens shows
    Point & Say, Live Translate and Import Media
- id: AC4
  text: Given the screen, when drawn, then light and dark frames exist at 390 px width and a 200% text frame, exported to
    docs/build/design/screens/
- id: AC5
  text: Given every colour, size, font and radius, when audited, then each references a token and none is hard-coded
- id: AC6
  text: Given the state kit, when the screen has data, then skeleton, empty, error, offline and reduced-motion frames are
    included
- id: AC7
  text: Given the T4 reviewer, when the visual evidence is checked, then the approval is recorded in the card report
