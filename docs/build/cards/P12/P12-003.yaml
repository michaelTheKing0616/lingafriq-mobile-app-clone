acceptance_criteria:
- id: AC1
  text: Given a fresh install, when the app first launches offline, then only the bundled core content loads and each missing
    pack shows a visible not-downloaded state, never empty lists
- id: AC2
  text: Given a language pack, when download starts and the network drops, then the download resumes from the last verified
    chunk and a typed PackDownloadError is surfaced if retries are exhausted
- id: AC3
  text: Given a downloaded pack, when its checksum does not match the manifest, then the pack is rejected, deleted and the
    learner sees a retry action
- id: AC4
  text: Given a pack is installed, when the app restarts in airplane mode, then its lessons open with no network call
