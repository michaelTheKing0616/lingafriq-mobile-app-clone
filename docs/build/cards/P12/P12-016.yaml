acceptance_criteria:
- id: AC1
  text: Given a release candidate, when rollout starts, then it proceeds in order 1%, 10%, 50%, 100% and never skips a stage
- id: AC2
  text: Given each stage, when the soak period ends, then promotion happens only if crash-free sessions and ANR rate meet
    thresholds read from release/gates.yaml
- id: AC3
  text: Given a gate metric is missing or stale, when promotion is evaluated, then rollout halts with a visible reason, never
    auto-promotes
- id: AC4
  text: Given a gate fails, when the workflow reacts, then it halts the rollout and opens an alert naming the failed metric
- id: AC5
  text: Given the workflow, when it commits, then it does not auto-increment and push commits (EP-§13.9-15 behaviour removed)
