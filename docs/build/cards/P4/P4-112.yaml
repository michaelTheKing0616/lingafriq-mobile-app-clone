acceptance_criteria:
- id: AC1
  text: Given the registry, when loaded, then Wave 1 holds yo, ig, ha, pcm, sw, xh, zu and Waves 2-4 hold the rosters decided
    in P4-111 with wave, scripts and readiness level per language
- id: AC2
  text: Given a language with two scripts (Fula Latin+Adlam, Bambara Latin+N'Ko, Tamazight Tifinagh+Latin), when registered,
    then each script is a separate entry sharing one language id
- id: AC3
  text: Given each language, when its readiness is updated, then it changes independently of every other language
- id: AC4
  text: Given the registry, when totals are computed, then they report 7, ~21, ~46 and 95+ as planning targets labelled targets
    and never as shipped counts
- id: AC5
  text: Given a Wave 4 language flagged community_consent_required (e.g. N|uu), when a kit is created without recorded consent
    and benefit-sharing terms, then creation fails CONSENT_MISSING
- id: AC6
  text: Given Wave 2 languages, when Stage 1 has not reached L1, then starting L0 for them is refused WAVE_GATE_NOT_MET
