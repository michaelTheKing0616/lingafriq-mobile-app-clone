acceptance_criteria:
- id: AC1
  text: Given an item, when it moves, then the only allowed order is Draft, AI-assist (optional, flagged ai_assisted), Native
    review ×2, Linguist approve, Audio recorded and aligned, QA, Scheduled publish, Monitor item stats, Revise, and any skip
    is rejected ILLEGAL_TRANSITION
- id: AC2
  text: Given Native review, when fewer than two distinct native approvals exist, then the item cannot reach Linguist approve
    (two-native rule, Native-verified promotion)
- id: AC3
  text: Given a published item, when edited, then it re-enters Revise as a new version with the previous one retained
- id: AC4
  text: Given Scheduled publish, when the time arrives, then the pack build runs and failure shows as a visible failed state
    without a silent retry loop
- id: AC5
  text: Given interim Beta publishing under D1, when used, then the item publishes only as label beta and the workflow records
    the pending native review
