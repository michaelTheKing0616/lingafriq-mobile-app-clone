acceptance_criteria:
- id: AC1
  text: Given validated content, when a pack is built, then it carries a semver, a manifest listing every object hash and
    an ed25519 signature, and the pack replaces the four legacy bundles
- id: AC2
  text: Given an audio or image file, when packed, then its filename is the ASCII content hash with extension and never contains
    orthography
- id: AC3
  text: Given any text in a pack, when built, then it is NFC-normalised or the build fails NFC_VIOLATION
- id: AC4
  text: Given a pack with a tampered file or bad signature, when verified, then verification fails PACK_SIGNATURE_INVALID
    and the pack is not installed
- id: AC5
  text: Given two pack versions, when diffed, then the diff manifest lists added, changed and removed hashes only and applying
    it to the old pack yields the new pack byte-identically
- id: AC6
  text: Given a content change, when the pack is rebuilt, then the semver bump follows the rule major=breaking id change,
    minor=new objects, patch=text or audio fix
