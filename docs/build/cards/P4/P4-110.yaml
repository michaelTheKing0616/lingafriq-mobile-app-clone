acceptance_criteria:
- id: AC1
  text: Given a language manifest, when gated for L0 Taste, then it passes only with greetings, numbers, 50-100 words, ≥1
    culture card and ≥2 voices of recorded audio, else READINESS_L0_FAIL with the missing items
- id: AC2
  text: Given a manifest, when gated for L1 Starter, then A1 coverage is complete, every item has audio that is human or labelled
    tts_synthetic passing its gate (C3/D6), and ASR "were you understood" feedback is enabled
- id: AC3
  text: Given a manifest, when gated for L2 Core, then A1-A2 is complete, tone and pronunciation scoring and dynamic TTS are
    enabled, AI tutor modes are enabled and ≥4 voices exist
- id: AC4
  text: Given a manifest, when gated for L3 Full, then A1-B1, realtime voice, personas and credential checkpoints are enabled
    with realtime and persona evals passing
- id: AC5
  text: Given a language, when promotion is requested, then it moves one level only when all gates for the next level pass,
    and failure leaves the level unchanged with the failing gate listed
- id: AC6
  text: Given native-recorded audio for every item and two-native approval, when the Native-verified promotion runs, then
    objects move from beta/expert_reviewed to native_verified, and no content ships unvalidated
