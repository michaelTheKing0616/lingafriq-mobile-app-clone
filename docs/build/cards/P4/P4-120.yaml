acceptance_criteria:
- id: AC1
  text: Given a language id, when a kit is created, then it contains an orthography spec (Unicode, NFC, diacritics, keyboard
    layout), dialect standard, phone inventory, tone system, phoneme-to-viseme table and seed lexicon, with each missing part
    listed as an open task
- id: AC2
  text: Given the seed lexicon, when imported, then every entry has provenance.sources[] with a licence from the register
    and unlicensed sources are rejected SOURCE_UNLICENSED
- id: AC3
  text: Given the reviewer panel, when the kit is marked complete, then ≥3 paid native reviewers with signed consent and licence
    terms are recorded, else the kit stays open
- id: AC4
  text: Given a kit, when week 1 ends, then the kit status shows days elapsed against the week 0-1 target and overdue kits
    are flagged
- id: AC5
  text: Given a tonal language, when the kit lacks a tone system, then the kit cannot start AI bootstrap
