acceptance_criteria:
- id: AC1
  text: Given any content object, when validated, then provenance.sources[] needs ≥1 entry with name, licence, uri-or-citation
    and retrieved_at, plus author and created_at, else typed error PROVENANCE_MISSING
- id: AC2
  text: Given a content object, when validated, then claims[] entries carry kind (tone|cultural|linguistic|factual) and source_ref,
    confidence is a number in [0,1], and risk_tags[] values come from a schema-fixed allowlist, else CLAIM_INVALID
- id: AC3
  text: Given a content object, when label is absent or not one of beta|expert_reviewed|native_verified, then validation fails
    LABEL_MISSING and no default label is inferred (D1)
- id: AC4
  text: Given any audio reference, when validated, then audio.kind is one of human|tts_synthetic and tts_synthetic entries
    must carry the "Synthetic voice" flag, else AUDIO_KIND_INVALID
- id: AC5
  text: Given an object with ai_assisted true, when validated, then model id and prompt id are recorded, and absence of ai_assisted
    fails AI_FLAG_MISSING
- id: AC6
  text: 'Given label native_verified, when review.reviewers lacks two distinct native reviewers plus one linguist approval,
    then validation fails NATIVE_VERIFIED_REQUIRES_TWO_NATIVES (D1: Elevation two-native rule is the promotion criterion)'
