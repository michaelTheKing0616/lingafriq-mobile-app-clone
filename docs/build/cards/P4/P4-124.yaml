acceptance_criteria:
- id: AC1
  text: Given a language, when ASR (Intron or Omnilingual) is evaluated, then a 300-utterance set is scored and the WER is
    recorded with set id and date
- id: AC2
  text: Given a vendor or custom TTS voice, when gated, then native MOS and tone-error rate must pass the thresholds set in
    the eval config or enablement fails TTS_GATE_FAIL
- id: AC3
  text: Given tone-scoring calibration, when run, then native judge ratings are stored per judge and agreement is reported
    before scoring is enabled for that language
- id: AC4
  text: Given a gate failure or missing eval set, when enablement is requested, then the feature stays off with a visible
    reason and no placeholder score is produced
- id: AC5
  text: Given yo, ig or ha TTS, when enabled, then enablement requires the tone-accuracy gate
