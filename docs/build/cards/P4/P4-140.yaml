- id: AC2
  text: Given lessons, chat, Polie, personas, games, the magazine and the dictionary, when they show target text, then each
    uses this widget and a lint rule fails any other direct Text rendering of lexeme content
- id: AC3
  text: Given stacked diacritics (ọ̀, ẹ́, ṣ) at 1.0x and 2.0x text scale, when rendered, then no glyph is clipped, verified
    by goldens
