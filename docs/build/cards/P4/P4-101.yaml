acceptance_criteria:
- id: AC1
  text: Given a lexeme, when validated, then id matches <lang>.lex.<slug>.<sense> and is unique within its language, else
    LEXEME_ID_INVALID
- id: AC2
  text: Given a lexeme, when validated, then lemma is NFC, orthography has standard, ascii_fallback and script, and ipa, tone_pattern
    and syllables are present for tonal languages, else typed error per field
- id: AC3
  text: Given senses[], when validated, then each has gloss_en, gloss_fr, domain and register, and minimal_pairs[] ids must
    resolve to existing lexemes, else MINIMAL_PAIR_DANGLING
- id: AC4
  text: Given audio[] entries, when validated, then each has voice_id, speed in natural|slow, a content-hash uri and aligned_phones,
    plus audio.kind from P4-100
- id: AC5
  text: Given an image field, when validated, then uri, alt_text and cultural_review in approved|pending|rejected are present
    and pending blocks native_verified
- id: AC6
  text: Given the yo ọkọ̀ fixture, when validated, then it passes and cefr plus frequency_rank are carried through unchanged
