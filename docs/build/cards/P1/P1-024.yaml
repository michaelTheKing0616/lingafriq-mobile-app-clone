acceptance_criteria:
- id: AC1
  text: Given a message or user, when the user reports it with a reason, then a report record is stored and acknowledged with
    a reference id
- id: AC2
  text: Given a user who blocks another, when the blocked user sends a message or snap, then it is not delivered and the blocker
    sees nothing
- id: AC3
  text: Given a user opening a blocked-user list, when they unblock, then delivery resumes for new messages only
- id: AC4
  text: Given report and block actions, when invoked by a client-supplied reporter id, then the server ignores it and uses
    the JWT subject
