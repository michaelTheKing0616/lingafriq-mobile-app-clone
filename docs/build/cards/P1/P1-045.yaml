acceptance_criteria:
- id: AC1
  text: Given sign-up, change-password or reset, when the password is under 8 characters, then it is rejected with a typed
    validation error
- id: AC2
  text: Given a password found in the breached-password check, when set, then it is rejected, and the check sends only a hash
    prefix so the password never leaves the server
- id: AC3
  text: Given the breach service is down, when a password is set, then it is accepted only if it passes local checks and the
    miss is logged
- id: AC4
  text: Given a user with a legacy Django hash, when they log in successfully, then the hash is replaced with Argon2id
- id: AC5
  text: Given the current sign-up rule is unverified, when the card starts, then the actual rule is read from code and recorded
    in the report
