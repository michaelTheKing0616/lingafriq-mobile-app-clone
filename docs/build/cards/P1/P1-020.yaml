acceptance_criteria:
- id: AC1
  text: Given a new user in onboarding, when they have not provided a date of birth, then account creation is blocked and
    the age gate is shown first
- id: AC2
  text: Given an entered age under 13, when submitted, then sign-up is blocked with a state explaining that guardian consent
    is not yet available, and no account or personal data is stored
- id: AC3
  text: Given an entered age of 13 to 17, when submitted, then the account is created with ageBand teen and restricted defaults
- id: AC4
  text: Given a client posting ageBand or dateOfBirth to the API, when validated, then the server computes the band itself
    and rejects an inconsistent value
- id: AC5
  text: Given an under-13 result, when the user returns to the gate on the same device, then the gate does not invite re-entry
    of a different birth date (neutral wording, device-local cooldown) and the blocked state is not bypassable by restarting
    onboarding
test_plan:
  unit:
