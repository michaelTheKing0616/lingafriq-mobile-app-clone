acceptance_criteria:
- id: AC1
  text: Given a new user in onboarding, when they have not provided a birth year, then account creation waits and the age
    gate asks for the year only
- id: AC2
  text: Given a birth year under the country child threshold, when consent is missing, then no account data is stored, and
    after verifiable parental consent the account is child mode with social, chat, marketplace, and ads gated off, moderated
    AI only, and Historical Personas free chat still available under child-safe moderation
- id: AC3
  text: Given a birth year in the teen band for that country, when the account is created, then the profile is private and
    direct messages from adults are gated off, and no feature is removed
- id: AC4
  text: Given a client posting an age band or a date of birth, when the server validates it, then the server computes the
    band from the birth year and the per-country config and rejects a band that does not match
- id: AC5
  text: Given a child without consent, when the same device sends another birth year or band, then no account data is stored
    before consent and the second request cannot widen access
