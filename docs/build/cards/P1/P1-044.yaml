- id: AC1
  text: Given 5 consecutive failed logins for one account from varied IPs, when the 6th is attempted, then it is delayed or
    rejected with 429 and a Retry-After value that grows with each further failure
- id: AC2
  text: Given a lockout, when the correct password is then supplied during the delay, then it is still rejected until the
    delay expires
- id: AC3
  text: Given a successful login, when completed, then the failure counter resets
- id: AC4
  text: Given the existing 10 per minute per-IP limiter, when retained, then it still applies in addition to the per-account
    control
- id: AC5
  text: Given lockout responses, when read, then they do not reveal whether the account exists
