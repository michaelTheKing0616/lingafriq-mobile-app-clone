- id: AC2
  text: Given a snap create request with an external media_url, when processed, then it returns 400 external_url_rejected
- id: AC3
  text: Given an upload, when requested, then the server issues a signed URL to the own bucket valid for a short set window
    and only that object key is accepted afterwards
- id: AC4
  text: Given an under-18 or unknown-age user, when they create a snap, then it is rejected (see P1-021)
