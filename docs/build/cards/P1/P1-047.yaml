acceptance_criteria:
- id: AC1
  text: Given a login, when tokens are issued, then the access token expires in 10 to 15 minutes
- id: AC2
  text: Given a refresh, when used, then it is rotated, the old one is invalidated and the new one is stored server-side hashed
- id: AC3
  text: Given reuse of an already-rotated refresh token, when presented, then the whole token family is revoked and a typed
    reuse_detected error is returned
- id: AC4
  text: Given logout or a password change, when completed, then all of the user's refresh tokens are revoked and a revoked
    token fails with 401
- id: AC5
  text: Given the client, when an access token expires, then it refreshes once and queues parallel requests without multiple
    refresh calls
