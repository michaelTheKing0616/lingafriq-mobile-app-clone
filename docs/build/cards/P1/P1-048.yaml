- id: AC1
  text: Given a signed-in user, when they register a passkey, then a credential is stored and listed in their security settings
- id: AC2
  text: Given a registered passkey, when they sign in with it, then they receive tokens per P1-047 with no password entry
- id: AC3
  text: Given a replayed or cross-origin assertion, when verified, then it is rejected
- id: AC4
  text: Given a device without passkey support, when the option is shown, then the user is offered Google, Apple or email
    link instead
- id: AC5
  text: Given a lost device, when the user removes a passkey, then it can no longer authenticate
