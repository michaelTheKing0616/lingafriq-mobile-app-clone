acceptance_criteria:
- id: AC1
  text: Given a request asking max_tokens above the per-mode cap, when processed, then the value is clamped to the cap and
    the response reports the clamped value
- id: AC2
  text: Given a user at their daily quota, when they call the gateway again, then it returns 429 quota_exceeded with a reset
    time and makes no provider call
- id: AC3
  text: Given the global monthly cost budget reaches 100 percent, when a request arrives, then it returns 503 budget_exhausted
    and an alert is emitted at 80 percent
- id: AC4
  text: Given concurrent requests from one user, when the quota counter is incremented, then no request exceeds the quota
    (atomic counter test)
