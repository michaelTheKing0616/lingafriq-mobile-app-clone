acceptance_criteria:
- id: AC1
  text: Given a user whose ageBand is under-18 or unknown, when they call a DM, call, snap or public-feed endpoint, then it
    returns 403 age_restricted
- id: AC2
  text: Given the same user over sockets, when they emit a DM, call or snap event, then it is rejected with a typed ack and
    no event is delivered
- id: AC3
  text: Given an existing user with no recorded age, when they open the app, then they are treated as unknown and restricted
    until age is provided
- id: AC4
  text: Given an adult user, when they call the same endpoints, then behaviour is unchanged (regression test)
