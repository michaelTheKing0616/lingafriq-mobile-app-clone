risks:
- "Normal JSON defaults to 256 KiB. Offline sync stays 2 MiB, outbox and passport submit stay 5 MiB, and a content-pack manifest stays 12 MiB. Voice, media, and snap prefixes stay at 10 MiB."
- "Auth register, login, refresh, logout, verification, OAuth, and magic link have Joi schemas. Other mutating routes are an explicit exemption until that handler's body is specified. A route missing from the inventory fails the test."
- "The first parser is the one that enforces the limit. A later express.json on the same route does not read the body again."
