acceptance_criteria:
- id: AC1
  text: Given the route inventory, when a script lists every route, then each has a zod or Joi schema or an explicit documented
    exemption
- id: AC2
  text: Given the global 10 MB JSON limit in app.ts, when changed, then the default is a small limit and only upload-style
    routes set a larger explicit limit
- id: AC3
  text: Given an oversize body on a normal route, when posted, then it returns 413
- id: AC4
  text: Given an invalid body, when posted, then it returns 400 with a typed validation error and no stack trace
- id: AC5
  text: Given CI, when a new route lacks a schema, then the route-inventory test fails
