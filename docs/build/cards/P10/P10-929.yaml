acceptance_criteria:
- id: AC1
  text: Given any AI-generated message, voice or image, when it is shown, then a visible AI label appears with it.
- id: AC2
  text: Given a persona, when a learner starts a chat or call, then it states in plain words that it is an AI persona and
    not a person.
- id: AC3
  text: Given AI-generated audio or media is exported or shared, when it leaves the app, then a machine-readable AI marker
    is attached.
- id: AC4
  text: Given an AI response arrives without the disclosure flag, when it would render, then the app blocks the render and
    shows an error state.
