acceptance_criteria:
- id: AC1
  text: Given a circle or classroom, when a quest goal is set, then progress is the sum of server-verified learning XP from
    members only.
- id: AC2
  text: Given a family challenge phrase of the week, when a learner teaches it back, then a member confirms and the server
    records completion once.
- id: AC3
  text: Given family members learn, when the Heritage Tree renders, then growth equals the count of verified can-dos across
    linked members.
- id: AC4
  text: Given a minor is a member, when any quest or tree is shown, then it is visible only inside the circle or class and
    shows no public identity.
- id: AC5
  text: Given a member leaves, when progress is recalculated, then their contribution is removed and the change is logged.
