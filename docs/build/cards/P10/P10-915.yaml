acceptance_criteria:
- id: AC1
  text: Given content and scoring are not yet real, when a Passport is requested, then the server returns typed error PASSPORT_PREREQ_NOT_MET
    and no credential is shown.
- id: AC2
  text: Given a learner passes a can-do task, when the server verifies it, then one portfolio entry is stored with task id,
    time, scorer attempt id and level.
- id: AC3
  text: Given a portfolio entry is tied to scorer output, when it is saved, then it stores the scorer confidence and an unsure
    state is never counted as a pass.
- id: AC4
  text: Given the portfolio is viewed, when it renders, then each entry lists the can-do and its evidence and nothing the
    learner did not pass.
- id: AC5
  text: Given a client submits portfolio data, when the server receives it, then it is rejected and only server evidence counts.
