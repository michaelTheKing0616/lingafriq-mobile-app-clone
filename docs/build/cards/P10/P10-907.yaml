acceptance_criteria:
- id: AC1
  text: Given a core lesson, when the learner makes any number of mistakes, then no heart is lost and no heart UI shows.
- id: AC2
  text: Given a core lesson, when a learner has zero hearts or zero energy, then the lesson still starts and completes with
    no energy gate.
- id: AC3
  text: Given Challenge Mode is off by default, when the learner turns it on, then hearts apply only to lessons and games
    started from Challenge Mode.
- id: AC4
  text: Given a Challenge Mode run is finished on hearts, when the learner wins, then a badge and a bragging-rights entry
    are awarded by the server.
- id: AC5
  text: Given hearts run out in Challenge Mode, when the run ends, then the learner can leave at once and core content stays
    open.
