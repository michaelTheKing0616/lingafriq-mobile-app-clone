acceptance_criteria:
- id: AC1
  text: Given a new learner, when they open leagues, then they are not enrolled until they opt in.
- id: AC2
  text: Given enrolled learners, when matching runs, then each league groups learners by time zone and activity level.
- id: AC3
  text: Given a league ranking, when it is computed, then it uses learning XP only and ignores raw taps and purchased items.
- id: AC4
  text: Given a learner under 18, when leagues are listed, then only circle or class leagues appear and public leagues return
    a typed error.
- id: AC5
  text: Given a learner opts out, when the next ranking runs, then they are removed and their data is not shown to others.
