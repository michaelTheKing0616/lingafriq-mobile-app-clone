acceptance_criteria:
- id: AC1
  text: Given a client posts a reward or balance value, when the server receives it, then it ignores the value and responds
    with typed error CLIENT_REWARD_REJECTED (HTTP 422).
- id: AC2
  text: Given a learning event with server-held evidence, when the server computes XP, then one append-only ledger row is
    written with evidence id, rule id and amount.
- id: AC3
  text: Given the same evidence id is submitted twice, when the server processes it, then exactly one ledger row exists and
    the second call returns the first result.
- id: AC4
  text: Given no ledger row exists for an amount shown in the app, when the client renders balances, then it reads only server
    ledger totals and shows an error state if the fetch fails.
- id: AC5
  text: Given the legacy self-minting write paths, when the migration runs, then each path is removed and a test proves a
    forged balance request changes nothing.
