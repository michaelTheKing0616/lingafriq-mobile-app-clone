acceptance_criteria:
- id: AC1
  text: Given a signed-in learner, when they tap Export my data, then they get a machine-readable archive of their data within
    7 days with status shown in the app.
- id: AC2
  text: Given a learner confirms deletion with re-authentication, when the job runs, then personal data is deleted across
    all mapped collections and a completion record is kept without personal data.
- id: AC3
  text: Given a deletion step fails, when the job runs, then the failure is logged, retried and shown to the learner as pending,
    never as done.
- id: AC4
  text: Given an export or deletion request, when it is made by another user id, then it is rejected with 403.
- id: AC5
  text: Given deletion completes, when the learner tries to sign in, then the account is gone and credentials are revoked.
