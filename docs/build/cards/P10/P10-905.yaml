acceptance_criteria:
- id: AC1
  text: Given a learner picks the weekly streak, when they practise on at least the weekly target days, then the streak continues
    and missing a single day does not break it.
- id: AC2
  text: Given a learner completes a set amount of practice, when the server awards a freeze token, then the token count rises
    by one up to a stored maximum.
- id: AC3
  text: Given a missed day with a freeze token, when the day rolls over in the learner's timezone, then a token is spent automatically
    and the streak holds.
- id: AC4
  text: Given a broken streak, when the learner opens the app inside the repair window, then repair is offered and the window
    length is read from config.
- id: AC5
  text: Given a streak is lost, when copy is shown, then it is neutral and offers repair and never uses guilt or loss framing.
