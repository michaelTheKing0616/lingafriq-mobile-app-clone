acceptance_criteria:
- id: AC1
  text: Given an earned level, when a credential is issued, then it is a W3C Verifiable Credential in Open Badges 3.0 form
    signed with the issuer key.
- id: AC2
  text: Given any credential, when a third party verifies it, then the signature, issuer and methodology link check out without
    a LingAfriq login.
- id: AC3
  text: Given a credential payload is altered, when it is verified, then verification fails with a typed error.
- id: AC4
  text: Given the issuer key, when the service runs, then the key is held in a secrets store and never logged or shipped in
    the app.
- id: AC5
  text: Given a learner has no verified evidence, when issue is requested, then CREDENTIAL_NOT_EARNED returns and nothing
    is signed.
- id: AC6
  text: Given the credential screen, when it renders, then it shows level, date, evidence summary and a share action.
