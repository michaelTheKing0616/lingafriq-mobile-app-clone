- id: AC2
  text: Given a revoked credential, when its holder opens it, then the screen shows a revoked state with the reason and the
    next step.
- id: AC3
  text: Given a revocation, when it is stored, then an audit row records who, when and why.
- id: AC4
  text: Given an unrevoked credential, when status is fetched, then it returns valid and a failed status fetch shows a visible
    unknown state, never valid.
