acceptance_criteria:
- id: AC1
  text: Given a learner has enough Cowries, when they buy a cosmetic avatar item, then the server debits the ledger once and
    the item appears in their inventory.
- id: AC2
  text: Given a broken streak inside the repair window, when the learner spends Cowries to repair it, then the streak is restored
    and the debit is one ledger row.
- id: AC3
  text: Given a persona chapter is reviewed and enabled, when the learner buys early access, then access is granted only for
    chapters whose persona flag is enabled.
- id: AC4
  text: Given any item in the shop, when it is displayed, then it states in plain words exactly what it does and its Cowries
    cost.
- id: AC5
  text: Given a balance too low, when the learner tries to buy, then purchase is blocked with a visible not-enough-Cowries
    state and no debit.
