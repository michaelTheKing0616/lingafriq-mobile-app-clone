acceptance_criteria:
- id: AC1
  text: Given a learner passes a can-do checkpoint, when the server verifies it, then one can-do badge is issued with checkpoint
    evidence.
- id: AC2
  text: Given a badge exists, when the learner shares it, then the share page shows the can-do text, level and a verify link.
- id: AC3
  text: Given a checkpoint is not passed, when the learner asks for the badge, then a typed error BADGE_NOT_EARNED returns
    and nothing is issued.
- id: AC4
  text: Given generic badges, magic items and the ancestral tree exist, when this card ships, then each is either mapped to
    a verified can-do or removed from the app.
