acceptance_criteria:
- id: AC1
  text: Given a learner has not opted in, when audio is scored, then the audio is deleted right after scoring and only the
    score and non-identifying metrics remain.
- id: AC2
  text: Given a learner opts in to store recordings, when they accept, then the consent text, version and time are stored.
- id: AC3
  text: Given an opted-in learner withdraws, when they confirm, then stored recordings are deleted within 30 days and a confirmation
    is shown.
- id: AC4
  text: Given a minor, when storage consent is asked, then it requires the guardian path before any recording is kept.
- id: AC5
  text: Given the consent screen, when it renders, then the toggle is off by default and explains in plain words what is stored
    and for how long.
