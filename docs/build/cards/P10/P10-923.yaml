acceptance_criteria:
- id: AC1
  text: Given storage consent is on, when training contribution is not separately agreed, then no recording enters any training
    set.
- id: AC2
  text: Given a learner agrees to contribute, when they accept, then a distinct consent record is stored with scope, version
    and time.
- id: AC3
  text: Given a learner withdraws, when they confirm, then their recordings are excluded from future training sets and listed
    for removal.
- id: AC4
  text: Given a minor, when contribution is offered, then it is not offered.
