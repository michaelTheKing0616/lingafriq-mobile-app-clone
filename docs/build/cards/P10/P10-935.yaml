acceptance_criteria:
- id: AC1
  text: Given a new experiment, when it is created, then it requires a written hypothesis, primary metric and minimum detectable
    effect before it can start.
- id: AC2
  text: Given an experiment targets a setting, when the setting is a minor's safety setting, then creation fails with a typed
    error.
- id: AC3
  text: Given a variant is assigned, when the learner returns, then the same variant is served and assignment is recorded.
- id: AC4
  text: Given an experiment ends, when results are read, then they show the pre-registered metric and MDE and no other metric
    is promoted as the result.
- id: AC5
  text: Given a guardrail breach, when it is detected, then the experiment stops automatically.
