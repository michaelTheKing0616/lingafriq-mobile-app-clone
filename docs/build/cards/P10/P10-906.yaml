acceptance_criteria:
- id: AC1
  text: Given any learner in any day, when reminders are scheduled, then at most 1 push reminder is sent per learner per local
    day.
- id: AC2
  text: Given a learner has not set a window, when the first reminder is scheduled, then quiet hours apply by default and
    no push is sent inside them.
- id: AC3
  text: Given a learner sets a window and timezone, when a reminder is due, then it is sent only inside that window in that
    timezone.
- id: AC4
  text: Given the local time is in quiet hours, when copy is chosen, then no loss-aversion copy is used.
- id: AC5
  text: Given a milestone is reached, when a reminder is composed, then it celebrates the milestone and never threatens a
    loss.
- id: AC6
  text: Given the learner turns reminders off, when the scheduler runs, then no push is sent and the setting survives reinstall.
