acceptance_criteria:
- id: AC1
  text: Given a learner donates Cowries, when the donation completes, then one ledger debit and one fund credit are written
    together or neither is.
- id: AC2
  text: Given the fund page shows impact, when it renders, then every figure comes from recorded fund records and no figure
    is invented.
- id: AC3
  text: Given no impact has been recorded yet, when the page renders, then it states that nothing has been funded yet.
- id: AC4
  text: Given a donation fails, when the learner is shown the result, then a typed error and a retry action appear and no
    Cowries are lost.
