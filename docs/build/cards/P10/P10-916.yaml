acceptance_criteria:
- id: AC1
  text: Given a learner starts the CAT, when the session opens, then the server issues a one-time session and proctoring rules
    are shown before start.
- id: AC2
  text: Given a proctoring rule is broken (app left, second voice, lost audio), when it is detected, then the session is flagged
    with a reason and held for review.
- id: AC3
  text: Given recordings are captured, when the session ends, then they are handled under the voice consent and retention
    rules and deleted by default after scoring.
- id: AC4
  text: Given the CAT ends, when the result is computed, then it combines with the portfolio and a result below confidence
    returns unsure, not a level.
- id: AC5
  text: Given a network failure mid-test, when the learner reconnects within the stored limit, then the session resumes and
    otherwise ends with a typed error.
test_plan:
  unit:
