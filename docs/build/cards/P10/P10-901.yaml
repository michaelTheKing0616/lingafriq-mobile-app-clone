acceptance_criteria:
- id: AC1
  text: Given an item recalled at its scheduled spaced interval, when XP is computed, then XP is awarded and an item recalled
    early awards less than one recalled on schedule.
- id: AC2
  text: Given a speaking task marked passed by the scorer, when XP is computed, then XP is awarded with the scorer attempt
    id as evidence.
- id: AC3
  text: Given a can-do is demonstrated for the first time, when XP is computed, then a can-do XP award is written once per
    can-do per learner.
- id: AC4
  text: Given the same easy item is answered repeatedly in one day, when XP is computed, then each repeat yields strictly
    less XP than the previous, reaching zero at a configured cap.
- id: AC5
  text: Given a tap with no learning evidence, when XP is computed, then XP is zero.
