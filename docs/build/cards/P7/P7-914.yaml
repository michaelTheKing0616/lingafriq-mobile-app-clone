acceptance_criteria:
- id: AC1
  text: Given a photo is processed, when processing ends and the learner has not saved it, then the photo is deleted from
    device temp storage and the server and the deletion is verified
- id: AC2
  text: Given a learner who is a minor, when a photo would be sent to a server model, then it is not sent unless guardian
    consent is recorded, and on-device detection is used instead
- id: AC3
  text: Given consent is absent, when the minor requests a server-only feature, then a visible explanation is shown and no
    photo bytes leave the device
- id: AC4
  text: Given a saved photo, when the learner deletes it, then the file and its server copy are removed
- id: AC5
  text: Given logs and analytics, when a photo is processed, then no image bytes or identifiers appear in them
