acceptance_criteria:
- id: AC1
  text: Given lessons in order, when the Path lays them out, then the nodes form a vertical scrolling zig-zag joined by dotted trails, the first lesson sits at the bottom, and later lessons sit above it.
- id: AC2
  text: Given a done lesson, when its node renders, then the node is green and shows a tick.
- id: AC3
  text: Given the current lesson, when its node renders, then the node is highlighted, the learner avatar sits beside it, and a Play now pill shows the lesson title.
- id: AC4
  text: Given a lesson the learner has not reached, when its node renders, then the node is grey and shows a lock.
- id: AC5
  text: Given an FSRS review is due, when that node renders, then the node is marked review-due from the scheduler and not from a fixed date.
- id: AC6
  text: Given P7-949 opens or skips a node for a fast learner, when the path renders, then that node is open or skipped and a lesson the learner may reach stays visible.
- id: AC7
  text: Given a screen reader or reduced motion, when a node is presented, then it exposes its number, title, and state, its tap target is at least 48 dp, and non-essential motion is still.
