acceptance_criteria:
- id: AC1
  text: Given mastery and a recent success rate outside 80 to 85 percent, when the next lesson is built, then its length, new-item mix, and difficulty move toward that band
- id: AC2
  text: Given a weak tone or pronunciation skill, when the next lesson is built, then it adds drills for that skill and still leaves every other lesson reachable
- id: AC3
  text: Given a recommendation, when it is shown, then the learner sees why it was chosen and can override or reset the pace
- id: AC4
  text: Given a learner under 16, when pacing runs, then adaptation matches other learners and no marketing profile is written
- id: AC5
  text: Given a fixture of learner traces, when adaptive pacing and fixed pacing are replayed, then the harness reports 7-day retention and completion for both and fails if adaptive is not higher
- id: AC6
  text: Given airplane mode, when the next lesson is chosen, then the choice uses the on-device estimate and makes no network call
