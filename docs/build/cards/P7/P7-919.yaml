acceptance_criteria:
- id: AC1
  text: Given a learner, when they list, add or delete My Words, then GET, POST and DELETE keep working against the existing
    endpoint contract
- id: AC2
  text: Given the device is offline, when My Words opens, then cached entries load and an offline banner is shown
- id: AC3
  text: Given a saved word that has a verified entry, when it is listed, then it links to that entry
- id: AC4
  text: Given a saved word with no verified entry, when it is listed, then it is marked personal and unverified
- id: AC5
  text: Given an add or delete fails, when the request errors, then a typed visible error appears and local state is not left
    inconsistent
