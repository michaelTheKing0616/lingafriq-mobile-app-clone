acceptance_criteria:
- id: AC1
  text: Given an active mission, when the learner submits a recording, then rubric feedback is returned via gateway using
    E-P6-SCORER criteria not ad-hoc client text.
- id: AC2
  text: Given Today challenges, when a weekly speak mission is live, then Speak → Missions and Today stay in sync on completion
    state.
- id: AC3
  text: Given release build, when evaluation runs, then no client Groq keys are present and failures show typed errors.
- id: AC4
  text: Given the scorer is unavailable or its confidence is below the gate threshold, when a score would be shown, then the
    UI shows the 'unsure' state, stores no number and never shows a fabricated score.
