acceptance_criteria:
- id: AC1
  text: Given a cropped region, when the server vision model is called through the AI gateway, then the response returns a
    label with a confidence score and a culturally specific object id from the curated set
- id: AC2
  text: Given a confidence below the configured threshold, when the result is returned, then the client shows Unsure and not
    a confident word
- id: AC3
  text: Given the gateway budget is exhausted or the call fails, when recognition is requested, then a typed error is returned
    and the client shows a visible retry state
- id: AC4
  text: Given the vision model name and version, when a request is made, then the model used is logged on the response and
    shown in AI disclosure, with no provider key in client code
- id: AC5
  text: Given an unauthenticated caller, when the endpoint is called, then it returns 401 and no model call is made
