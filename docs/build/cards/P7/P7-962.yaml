acceptance_criteria:
- id: AC1
  text: Given an image, when import runs, then the transcript comes from OCR of that image. Low confidence is named. The step does not invent text that the OCR did not return.
- id: AC2
  text: Given an audio clip, when import runs, then the transcript comes from transcription of that audio. A failed transcription shows an error and does not build a lesson.
- id: AC3
  text: Given a video, when import runs, then the transcript comes from that video's audio track. If the track is missing, the step says there is no audio and does not invent a transcript. On-screen text is included only when OCR of the frames actually ran.
- id: AC4
  text: Given pasted text or a text file, when import runs, then that text is the transcript. The step does not claim it was transcribed.
- id: AC5
  text: Given a transcript and the learner's language, when translation runs, then the lesson stores the source sentence and a translation. A machine translation is tagged AI-generated, unreviewed. A failed translation keeps the source and says the translation is unavailable.
- id: AC6
  text: Given that transcript, when the P7-961 builder runs, then the structured lesson uses one verbatim source sentence. The translation sits beside it and is not substituted as the model sentence.
