acceptance_criteria:
- id: AC1
  text: Given a photo of a sign, menu or label, when OCR mode runs, then the text is translated and each phrase is listed
    with the source text
- id: AC2
  text: Given stacked tone marks, when a diacritic-restoring pass runs, then marks lost by Latin-only OCR are restored and
    a restored marker is shown on each changed character
- id: AC3
  text: Given restoration confidence is low, when text is shown, then it is marked Unsure and not presented as verified
- id: AC4
  text: Given a translated phrase, when the learner taps Read it aloud, then audio plays from the lexicon or labelled TTS
- id: AC5
  text: Given the on-device device check outcome from the verification card, when OCR mode is configured, then the pipeline
    choice follows that outcome
- id: AC6
  text: Given OCR fails or the model is unavailable, when the learner scans, then a typed visible error is shown
