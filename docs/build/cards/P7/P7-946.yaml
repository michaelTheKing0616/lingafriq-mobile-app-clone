- id: AC1
  text: Given a label with a Living Dictionary entry for the active language, when it is shown, then the screen shows the word, the example sentence, and plays audio through the human-first resolver
- id: AC2
  text: Given a label with no entry, when it is shown, then the copy says not in the dictionary yet and offers to submit the word to the review queue
- id: AC3
  text: Given the learner saves a recognised word, when the save succeeds, then the word is added once to the Lens collection used by spaced repetition
- id: AC4
  text: Given a suggestion, when it is queued, then the text is stored as submitted and is not rewritten
