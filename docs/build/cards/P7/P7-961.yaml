  text: Given that lesson, when the guided step is read, then one word is hidden, that word occurs in the model, and the rest of the sentence stays visible.
- id: AC3
  text: Given that lesson, when the flashcards are read, then there are at most 10, the answers are distinct, each answer occurs verbatim in the transcript, and each card stores the media id and the span.
