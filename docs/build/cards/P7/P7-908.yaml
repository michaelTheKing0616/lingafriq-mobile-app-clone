acceptance_criteria:
- id: AC1
  text: Given the mic is held, when the learner speaks, then audio is scored by the real GOP and tone scorer and not by the
    placeholder tone endpoint
- id: AC2
  text: Given a result, when it is shown, then the native contour is overlaid on the learner's contour
- id: AC3
  text: Given scorer confidence is low, when the result is shown, then an honest Unsure state is shown and no numeric score
    is fabricated
- id: AC4
  text: Given a successful pronunciation, when scoring completes, then a haptic fires and the avatar appears in the corner
    to celebrate
- id: AC5
  text: Given reduced motion, when the avatar celebrates, then a static celebration is shown
- id: AC6
  text: Given the scorer is unreachable, when the learner speaks, then a typed visible error is shown and the attempt is queued,
    not silently dropped
