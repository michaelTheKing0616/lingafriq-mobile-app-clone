acceptance_criteria:
- id: AC1
  text: Given a language and a unit, when the path renders, then the characters and props match that language and unit for Yoruba, Igbo, Hausa, Zulu, Xhosa, Swahili, and Pidgin.
- id: AC2
  text: Given the path background, when it renders, then the parchment texture follows the language theme.
- id: AC3
  text: Given nodes ahead of the current lesson, when they render, then those areas are dimmed.
- id: AC4
  text: Given a licensed Polie .riv file, when reduced motion is off, then Polie animates from that file. Given no licensed .riv, when the path renders, then Polie is a labelled still and no unlicensed animation plays.
- id: AC5
  text: Given an illustration, when it is bundled, then the licence register names an original or commercial licence, and a missing or non-commercial row keeps the file out of the bundle.
- id: AC6
  text: Given a screen reader, when scene art is shown, then the image has alt text and is not described by colour alone.
- id: AC7
  text: Given the v3 scenery file, when a prop is shown, then it is loaded by artboard name, the licence register records the art as original and Nunito as SIL OFL 1.1, and the visible title and subtitle are unit strings rather than UNIT TITLE or UNIT 1.
