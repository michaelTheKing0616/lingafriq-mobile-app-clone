acceptance_criteria:
- id: AC1
  text: Given release build, when the learner opens this tutor mode, then all AI calls use the gateway and failures surface
    typed errors.
- id: AC2
  text: Given an active session, when the learner uses the mic, then transcript and feedback drawer update without client-side
    provider keys.
- id: AC3
  text: Given the learner completes the exercise, when scoring runs, then results use E-P6-SCORER outputs and never fabricated
    rhythm or placeholder scores.
- id: AC4
  text: Given the scorer is unavailable or its confidence is below the gate threshold, when a score would be shown, then the
    UI shows the 'unsure' state, stores no number and never shows a fabricated score.
