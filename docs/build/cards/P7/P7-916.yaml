acceptance_criteria:
- id: AC1
  text: Given a lexicon entry, when it is stored, then it holds a lemma with full tone marks, IPA, part of speech, noun class,
    senses, dialect variants and audio references
- id: AC2
  text: Given the schema, when any of the 7 Stage-1 languages or a later wave language is stored, then one schema validates
    all of them with no per-language fork
- id: AC3
  text: Given an entry, when its status is set, then only the transitions AI-drafted to native-verified are accepted and any
    other raises a typed error
- id: AC4
  text: Given a client read, when an entry is returned, then its verification status is included so the UI can label it honestly
- id: AC5
  text: Given a lemma without tone marks for a tonal language, when it is saved, then validation fails loudly
- id: AC6
  text: Given any caller, when they write a verified entry directly, then the write is rejected and only the Verify queue
    can promote
