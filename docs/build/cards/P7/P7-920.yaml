acceptance_criteria:
- id: AC1
  text: Given a learner, when they suggest a word or meaning, then it enters the Verify queue with status pending and is not
    visible in the Verified Lexicon
- id: AC2
  text: Given a pending suggestion, when 2 distinct native reviewers approve it, then it is promoted into the Verified Lexicon
- id: AC3
  text: Given a suggestion with only 1 approval or any rejection pending, when promotion is attempted, then it is refused
    with a typed error
- id: AC4
  text: Given the same reviewer approves twice, when counted, then it counts once
- id: AC5
  text: Given a promoted entry, when displayed, then credit to the suggester is shown unless they opted out
- id: AC6
  text: Given a suggester under 18, when credit is displayed, then only the safety-epic-approved display form is used
- id: AC7
  text: Given a non-native user, when they open the queue, then they cannot approve
