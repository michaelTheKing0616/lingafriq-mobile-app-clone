acceptance_criteria:
- id: AC1
  text: Given a learner with a target language in their profile, when Lens opens, then it uses that language and shows no
    free-text language field
- id: AC2
  text: Given Lens is open, when the learner taps the language chip, then they can switch among their profile languages only
    and the choice persists for the session
- id: AC3
  text: Given the camera is live, when detection boxes are drawn, then they render as soft rounded boxes with a breathing
    animation
- id: AC4
  text: Given reduced motion is enabled, when boxes render, then they are static with no breathing animation
- id: AC5
  text: Given camera permission is denied, when Lens opens, then a typed visible permission state with a Settings action is
    shown and no blank screen appears
- id: AC6
  text: Given the legacy route point-and-say, when it is opened, then it resolves to the Lens screen and the 982-line screen
    is replaced without a dead route
