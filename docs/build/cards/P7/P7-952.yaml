acceptance_criteria:
- id: AC1
  text: Given a unit boundary, when the path renders, then a banner shows the unit name, the CEFR level, and the can-do statement.
- id: AC2
  text: Given a current node, when the path opens, then the page scrolls that node into view.
- id: AC3
  text: Given a tap on a node, when the preview opens, then it shows the lesson goal, the time, the XP, and start or review.
- id: AC4
  text: Given a path longer than one viewport, when the learner scrolls, then sections outside the window are not built until they approach the viewport.
- id: AC5
  text: Given a low-end Android frame log, when the median frame time is above 16.7 ms, then the run fails the 60 fps bar and is not described as met.
- id: AC6
  text: Given the device is offline and the path rows are in Drift, when the learner opens Path, then the nodes render from Drift and the screen does not wait on the network.
