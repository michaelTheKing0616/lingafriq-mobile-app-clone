acceptance_criteria:
- id: AC1
  text: Given a word in a lesson, chat, feed, status or game, when the learner long-presses it, then the Word Card opens for
    that word
- id: AC2
  text: Given a word not in the lexicon, when long-pressed, then a visible not-found state offers to suggest it
- id: AC3
  text: Given an inflected form, when long-pressed, then it resolves to its lemma entry or shows the not-found state
- id: AC4
  text: Given a long-press, when the lookup runs offline, then it uses the offline pack and shows an offline state if the
    word is absent
- id: AC5
  text: Given a screen reader, when a word is focused, then a custom action opens the Word Card
- id: AC6
  text: Given each of the listed surfaces, when tested, then the shared widget is used and no surface has its own copy
