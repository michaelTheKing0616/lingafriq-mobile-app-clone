  text: Given a held-out African-objects set, when evaluation runs, then it reports top-3 accuracy and does not train on that set
- id: AC3
  text: Given the classes plantain, garri, agbada, mortar and pestle, danfo, akara, and kente, when they are in the licensed set, then each has a label the on-device model can emit
