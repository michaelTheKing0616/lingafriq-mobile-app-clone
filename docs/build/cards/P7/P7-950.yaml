- id: AC2
  text: Given a network connection and no image opt-in, when a fallback would help, then the screen asks before sending and no photo leaves the device
- id: AC3
  text: Given opt-in, when the gateway returns Living Dictionary matches, then those words are shown and an ImageNet label is not substituted for them
- id: AC4
  text: Given a confident match, when the learner has not confirmed it and opted in to the fine-tune set, then the photo is discarded after the reply
