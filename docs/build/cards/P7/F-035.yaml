delta:
  current_state: Routed Polie workspace with client-side Groq calls and five unrouted chat variants.
  defects_to_fix:
  - Monolithic workspace screen with client API keys and no backend streaming.
  - Silent AI fallbacks and swallowed errors.
  elevation_to_build:
  - Voice-first hold-to-talk with live transcript, Tone Lens, recasts, hint ladder, and save phrase.
  - Mode chips and learner-model-aware replies through the AI gateway with streaming and lip-sync avatar.
  ux_and_render:
  - Large target-language chat with tap gloss and avatar bust showing listen/think/speak states.
  - Explicit AI-unavailable state; no silent fake replies.
  hub_placement: Speak tab root → Polie.
  unlock_stage: per §17.4
  harvest_list:
  - Tracking and enhanced conversation flows from unrouted ai_chat_screen variants.
acceptance_criteria:
- id: AC1
  text: Given release build without client keys, when the learner opens Polie and holds to talk, then audio transcribes via
    the gateway with streaming replies and no Groq client calls.
- id: AC2
  text: Given Polie replies in the target language, when the learner taps a line, then Tone Lens and gloss appear and save-phrase
    persists to the outbox offline.
- id: AC3
  text: Given AI gateway failure, when the learner sends a message, then ai_unavailable state shows what failed and next steps
    without placeholder success copy.
- id: AC4
  text: Given unrouted legacy chat screens, when navigation is audited, then only the consolidated Polie workspace route remains
    wired from Speak.
