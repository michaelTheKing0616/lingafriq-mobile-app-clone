- id: AC2
  text: Given a coarse label such as Food or Home good, when no curated mapping exists, then the box is shown as Unsure and
    is not given a word
- id: AC3
  text: Given detection fails or times out, when the learner is on the screen, then a typed visible fallback state offers
    tap-to-recognise via the server and no fake label appears
