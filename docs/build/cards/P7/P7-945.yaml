- id: AC1
  text: Given airplane mode, when a camera frame is classified, then the label comes from the bundled TFLite model and no photo or embedding is sent off the device
- id: AC2
  text: Given the bundled model file, when its licence register row is read, then the row is Apache-2.0 and names the exact checkpoint
- id: AC3
  text: Given a frame, when classification finishes, then the top three labels are returned with scores and the ML Kit five-way food/home/fashion/plant/place label is not the result
- id: AC4
  text: Given a latency log from a mid-range Android, when p50 is above 150 ms, then the run is recorded as failing that bar and is not described as met
- id: AC5
  text: Given the current navigation, when this card ships, then Point and Say stays on its existing route and is not moved
