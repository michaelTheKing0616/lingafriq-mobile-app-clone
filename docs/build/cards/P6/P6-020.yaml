- id: AC1
  text: Given the Intron proxy, when the client requests STT, then the call goes through the authenticated gateway route and
    covers all seven Stage-1 languages
- id: AC2
  text: Given the unauthenticated Hugging Face and Groq Whisper STT paths, when migration lands, then they are removed and
    requests without a token get HTTP 401
- id: AC3
  text: Given Yoruba, Igbo or Hausa audio, when routed, then Whisper-family models are never selected because they drop tone
