acceptance_criteria:
- id: AC1
  text: Given the substring blocklist in roleplay_safety_filter, when this card is done, then it is removed and replaced by
    a classifier-driven policy.
- id: AC2
  text: Given questions on Yaa Asantewaa's war, apartheid discrimination or Shaka's military history, when asked, then each
    is answered historically at the age tier's level and never blocked.
- id: AC3
  text: Given the words "skill" or "whatever", when typed, then they never trigger a block (regression test).
- id: AC4
  text: Given violence in a source, when discussed, then it is contextualised and never glorified, with a policy table per
    age tier (under-13, 13-17, adult) written with historians.
- id: AC5
  text: Given a slur present in a source, when quoted, then it is not reproduced; the reply paraphrases and adds a note that
    wording was omitted.
- id: AC6
  text: Given classifier failure, when a turn is served, then it fails closed with a typed SensitivityCheckFailed error and
    a visible retry state.
