acceptance_criteria:
- id: AC1
  text: Given a dossier JSON, when validated, then it requires primary_sources[], secondary_sources[], contested_points[],
    known_myths[], death_date and review {historian_id, signed_at} or fails with a typed DossierInvalid error naming the field.
- id: AC2
  text: Given a valid dossier, when ingested, then each source is stored as a retrievable card with a stable source_id and
    a retrieval index exists per persona.
- id: AC3
  text: Given a persona turn, when it is served, then retrieval runs against that persona's index before generation; with
    zero retrieved cards the turn returns a typed NoGroundingError (no plain-system-prompt fallback).
- id: AC4
  text: Given the legacy 27-persona client registry and the backend persona chat, when this card is done, then one dossier-backed
    registry is the only source and the client registry is removed or generated from it.
test_plan:
  unit:
