acceptance_criteria:
- id: AC1
  text: 'Given a model reply, when parsed, then it must match {speech_text, language_teaching_points[], claims[{text, support:
    documented|inferred|legend, source_ids[]}], emotion, next_beat} or the server returns a typed AnswerContractViolation
    and nothing is shown.'
- id: AC2
  text: Given a claim with support documented, when validated, then every source_id must exist in the persona's dossier index
    and be among the retrieved cards of this turn; otherwise the claim is rejected.
- id: AC3
  text: Given a claim with no retrieved support, when validated, then it is downgraded to inferred or removed, never left
    as documented.
- id: AC4
  text: Given a stored persona response, when written, then sources[] holds real source_ids and no hard-coded confidence value
    is stored or shown.
- id: AC5
  text: Given an answer, when emitted, then emotion is a member of the CharacterVM expression enum from ADR-030.
