acceptance_criteria:
- id: AC1
  text: Given conflict C2, when ADR-002 is written, then it records that a tone mark with three-way agreement (lexicon, generator,
    restorer) may publish as Beta, citing D6
- id: AC2
  text: Given a tone mark with no lexicon anchor, when the rule is read, then it is a hard failure and the token goes 100%
    to a linguist; tone teaching notes are Expert-reviewed at minimum, never Beta
- id: AC3
  text: Given generation principles, when listed, then every item cites a source claim by claim, a second model family cross-checks,
    MT back-translation and deterministic linters run, and each item carries a confidence score
- id: AC4
  text: Given confidence routing, when stated, then high scores publish as Beta, mid scores go to the human queue and low
    scores are rejected and regenerated
- id: AC5
  text: Given expert spot-checks, when stated, then 100% of high-risk items are reviewed (tone marks without lexicon match,
    idioms, culture and history, honorifics, grammar explanations) plus a statistical sample of the rest, with the 2 linguists
    per Stage-1 language of D4 as the owners (EXT-11)
- id: AC6
  text: Given D2 and D5, when recorded, then Oxford, IgboAPI and Zulu dictionary purchases and the Curriculum Studio build
    are listed as the lexicon and tooling prerequisites with their EXT cards
- id: AC7
  text: Given the legal reading in the source, when recorded, then licences are marked a product manager reading pending counsel
    sign-off of the licence register (EXT-03)
