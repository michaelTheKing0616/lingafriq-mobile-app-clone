acceptance_criteria:
- id: AC1
  text: Given lib/, when `python3 scripts/plan/repo_map.py` runs, then docs/build/REPO_MAP.md lists every route, screen class
    and provider with file path
- id: AC2
  text: Given lib/main.dart as root, when the import graph is walked, then REPO_MAP.md reports reachable files, files unreachable,
    files imported by nothing, unreachable screens and line totals, and prints a delta table against the source figures 330,
    183, 88 and 49,074 lines instead of forcing a match
- id: AC3
  text: Given the 44 audited feature areas (EP-§2-01…44), when REPO_MAP.md is built, then each area maps to at least one file
    or is marked NOT-BUILT with the source status word (Partial, Fake, Broken, Not built yet)
- id: AC4
  text: Given the 25 revival screens (REV-01…25) and 3 developer examples (DEV-01…03), when mapped, then each is listed with
    its file and reachability so P3 cards can cite it
- id: AC5
  text: Given the 151 user-facing features of the source, when REPO_MAP.md is built, then a feature-to-screen table has 151
    rows or lists each missing feature explicitly; nothing is dropped from the table
- id: AC6
  text: Given a configured backend path, when the script runs, then backend routes and socket events are listed; when the
    path is absent, then the script prints BACKEND-NOT-IN-REPO and the section is marked unmapped, never empty-OK
- id: AC7
  text: Given test directories, when counted, then REPO_MAP.md records Flutter test files and backend test files and shows
    them next to the source figures 64 and 52
- id: AC8
  text: Given the social-style screens (wa-, snap-, x- families), when mapped, then each is tagged with its learning-loop
    link or NONE so the no-copy rule can be audited
