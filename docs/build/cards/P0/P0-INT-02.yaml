acceptance_criteria:
- id: AC1
  text: 'Given a staged agent-facing file without `charter: v2`, when `git commit` runs, then the pre-commit hook runs `python3
    scripts/check_agent_files.py --staged`, exits 1 and lists the file'
- id: AC2
  text: Given a fresh clone, when `scripts/install_hooks.sh` runs, then `git config core.hooksPath` equals `.githooks` and
    the script is idempotent on a second run
- id: AC3
  text: Given a pull request, when the CI job `agent-files` runs, then it checks out with full history and runs `python3 scripts/check_agent_files.py
    --diff origin/main`
- id: AC4
  text: Given a PR that changes an agent-facing file without the marker, when CI runs, then the job fails and the log lists
    each offending file
- id: AC5
  text: Given a PR with no agent-facing changes, when CI runs, then the job passes in under 60 seconds
