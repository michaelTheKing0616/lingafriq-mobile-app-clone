acceptance_criteria:
- id: AC1
  text: Given the ADR template, when ADR-001 is written, then it records labels Beta, Expert-reviewed and Native-verified,
    status Accepted (Tope) dated per D1, and closes CONFLICTS C1
- id: AC2
  text: Given the policy, when read, then Beta content is excluded from checkpoints, placement, credentials and children's
    mode, and grammar and culture items are never Beta
- id: AC3
  text: Given synthetic audio, when the ADR is read, then every TTS item carries the visible tag "Synthetic voice" and every
    learner-facing item exposes a "Report a mistake" action feeding the pipeline
- id: AC4
  text: Given the Elevation §6.6 two-native-reviewer rule, when the ADR is read, then it is recorded as the Native-verified
    promotion criterion, not removed
- id: AC5
  text: Given the timeline claims, when recorded, then Beta A1 for all seven languages in about 12 weeks, A2 in about 24 weeks,
    B1 Expert-reviewed by about month 9 and USD 4k to 15k content cost are labelled planning estimates to be replaced by pilot
    measurements
- id: AC6
  text: Given the stop-rule on unreviewed AI content, when the ADR is read, then it states that no AI-generated language content
    ships without a label and the pipeline route (rebuild of current placeholder data goes through the same pipeline)
- id: AC7
  text: 'Given the ADR, when the verification section is read, then it names the conformance checks later cards must pass:
    label enum in the content schema, Beta-exclusion test, Synthetic-voice tag test'
