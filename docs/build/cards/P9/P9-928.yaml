acceptance_criteria:
- id: AC1
  text: Given a confirmed CSAM or imminent-harm case, when the safety lead approves it, then a report package is generated
    for NCMEC CyberTipline for US-linked content and the configured local equivalent for the user's country
- id: AC2
  text: Given an escalation, when created, then it records who approved, when it was submitted, the reference id returned
    and the evidence retention end date
- id: AC3
  text: Given no safety lead is assigned, when a case needs escalation, then the console shows ESCALATION_BLOCKED_NO_SAFETY_LEAD
    and pages the owner rather than dropping the case
- id: AC4
  text: Given the runbook, when read, then it lists each country's hotline and legal contact and is marked unverified until
    counsel confirms
