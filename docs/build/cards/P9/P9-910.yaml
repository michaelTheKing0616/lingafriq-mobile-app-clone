acceptance_criteria:
- id: AC1
  text: Given a media upload, when requested, then the server issues a signed URL scoped to one object, one user and a 10
    minute expiry, and a message referencing any other URL is rejected with MEDIA_URL_EXTERNAL
- id: AC2
  text: Given a voice note, when processed, then it is stored as Opus; given a video, then it is transcoded to HEVC or AV1
    where supported and H.264 as fallback
- id: AC3
  text: Given a file above the size limit for its type, when uploaded, then it is rejected with MEDIA_TOO_LARGE before transcode
- id: AC4
  text: Given an image with GPS EXIF, when processed, then the stored file contains no EXIF location or device metadata
- id: AC5
  text: Given a transcode failure, when it occurs, then the message shows a visible failed-media state and the original is
    not served
