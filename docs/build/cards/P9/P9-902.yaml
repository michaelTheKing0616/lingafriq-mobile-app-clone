acceptance_criteria:
- id: AC1
  text: Given a connected socket, when it stops heartbeating, then its presence key expires from Redis within the configured
    TTL (default 45 s) and subscribers receive one offline event
- id: AC2
  text: Given 1,000 simultaneous connects, when each connects, then the server emits no global online-list broadcast and the
    number of presence events per connect is bounded by that user's contacts and rooms, not by N
- id: AC3
  text: Given a minor account, when presence is requested by a non-approved user, then the response reveals nothing and returns
    the same shape as an unknown user
