- id: AC1
  text: Given an uploaded image or sampled video frames, when processed, then a classifier verdict and a perceptual hash are
    stored with the media record before the media becomes visible to other users
- id: AC2
  text: Given a hash matching the internal banned-content list, when uploaded again, then it is blocked with MEDIA_BANNED
    and the uploader is flagged
- id: AC3
  text: Given the classifier returns 'unsure', when the upload is from a minor or to a minor-visible surface, then it is held
    for human review
- id: AC4
  text: Given video longer than the sampling window, when processed, then frames are sampled at the configured interval and
    the card documents the coverage
