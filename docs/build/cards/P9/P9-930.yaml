acceptance_criteria:
- id: AC1
  text: Given any message, profile, clip, room or comment, when the user opens its menu, then block, mute and report are each
    reachable in at most two taps, verified by an integration test that counts taps
- id: AC2
  text: Given a block, when confirmed, then the blocked user cannot message, see presence, or find the blocker, and existing
    shared-circle messages are hidden for the blocker
- id: AC3
  text: Given a report, when submitted, then it creates a moderation case with the content snapshot and reason and the reporter
    sees a confirmation with a case id
- id: AC4
  text: Given offline state, when the user reports, then the report queues locally with a visible 'will send' state and is
    delivered on reconnect
