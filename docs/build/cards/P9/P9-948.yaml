- id: AC2
  text: Given a clip, when posted, then it needs a language tag and a caption passed through the moderation hook
- id: AC3
  text: Given a minor, when posting, then the clip can go only to a guardian-approved circle and never to the public feed
- id: AC4
  text: Given the old snap camera, stories and streaks and the X-style compose, explore, lists and notifications, when rebuilt,
