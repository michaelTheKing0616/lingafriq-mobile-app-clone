acceptance_criteria:
- id: AC1
  text: Given any message, profile text, clip, caption or room title, when submitted, then it passes pre-send checks and returns
    a typed verdict (allow, hold, block, escalate, unsure) before delivery
- id: AC2
  text: Given a detector timeout or error, when a verdict cannot be produced, then minors' content is held and adult content
    is delivered but queued for review, and never silently marked allowed
- id: AC3
  text: Given the old cosmetic toxicity filter, when this card is complete, then it is removed and a test asserts the new
    pipeline is the only path
- id: AC4
  text: Given a new surface from F-103 to F-136, when it registers a content type, then it must declare its pipeline hook
    or the build fails
- id: AC5
  text: Given a verdict, when stored, then it records detector ids, language, confidence and policy version for audit
