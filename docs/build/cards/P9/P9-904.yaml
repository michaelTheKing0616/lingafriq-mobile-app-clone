acceptance_criteria:
- id: AC1
  text: Given a user who is not a member of a circle, village or competition, when they emit join_room for it, then the server
    denies with ROOM_FORBIDDEN and the socket never receives that room's events
- id: AC2
  text: Given a client-supplied sender id that differs from the authenticated user, when a message is emitted, then the server
    overwrites it from the session and logs a spoofing attempt
- id: AC3
  text: Given a global broadcast event, when emitted by a non-admin socket, then it is rejected with BROADCAST_FORBIDDEN
- id: AC4
  text: Given the previously unwired subscription handlers, when the server starts, then each is registered and a startup
    test fails if a declared handler is missing
- id: AC5
  text: Given a member removed from a circle while connected, when removal commits, then their sockets leave the room within
    2 s
