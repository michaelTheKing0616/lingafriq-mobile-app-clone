acceptance_criteria:
- id: AC1
  text: Given two server nodes behind sticky sessions, when a client on node A emits to a room that has a member on node B,
    then node B delivers it within 500 ms via the Redis adapter
- id: AC2
  text: Given PM2 configured in cluster mode with N workers, when one worker is killed, then clients reconnect to another
    worker within 5 s and resume from their cursor without duplicate delivery
- id: AC3
  text: Given Redis becomes unreachable, when a socket event is emitted, then the server returns a typed REDIS_UNAVAILABLE
    error to the sender and never reports delivery success
- id: AC4
  text: Given the onlineUsers in-process map, when the card is complete, then no presence or room state is held only in process
    memory
