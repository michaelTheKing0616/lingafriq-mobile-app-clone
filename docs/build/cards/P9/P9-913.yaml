acceptance_criteria:
- id: AC1
  text: Given a child in pending-guardian state, when a guardian is invited, then the child account stays inert until the
    guardian completes an identity-verified consent step recorded with timestamp, policy version and jurisdiction regime (NDPA
    2023, GDPR Art. 8 or COPPA)
- id: AC2
  text: Given a guardian, when linking multiple children, then each child has an independent consent record that can be reviewed
    and withdrawn
- id: AC3
  text: Given consent withdrawal, when confirmed, then the child's social capabilities are disabled within 60 s and a data
    deletion or retention decision is queued per policy
- id: AC4
  text: Given an unverified or expired guardian link, when the child attempts any gated action, then it fails with GUARDIAN_CONSENT_REQUIRED
    and no partial access
- id: AC5
  text: Given a guardian with no link, when opening the hub, then an honest empty state explains what the hub does
