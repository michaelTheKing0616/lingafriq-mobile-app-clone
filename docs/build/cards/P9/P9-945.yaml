acceptance_criteria:
- id: AC1
  text: Given a message in a target language, when the user taps a word, then a gloss appears and the word can be saved to
    review in at most two taps
- id: AC2
  text: Given Tone Lens on a message, when opened, then it shows the tone marks and meaning on device; if the tone cannot
    be determined it states 'unsure' rather than guessing
- id: AC3
  text: Given 'check my message' before sending, when run, then it returns suggestions and the user can send unchanged or
    edited
- id: AC4
  text: Given the user's Language Status, when set, then it shows learning or native for a language and is visible only to
    allowed viewers
- id: AC5
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
