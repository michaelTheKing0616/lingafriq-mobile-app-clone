acceptance_criteria:
- id: AC1
  text: Given a live session, when the teacher starts recording, then every participant sees a persistent recording indicator
    and a recording starts only after consent from each adult and guardian consent for each minor
- id: AC2
  text: Given a participant who declines, when recording is active, then they are moved to an unrecorded state or may leave
    and no audio or video from them is stored
- id: AC3
  text: Given a session token, when issued, then it is scoped to one classroom, one user and expires within 10 minutes
- id: AC4
  text: Given a recording, when stored, then it carries a retention date and is deleted at that date
