acceptance_criteria:
- id: AC1
  text: Given an adult account, when starting a 1:1 or small-group chat, then E2EE is on by default and the thread shows a
    visible encryption state
- id: AC2
  text: Given any account whose tier is under 18, when E2EE is requested, then the client does not offer it and the server
    refuses
- id: AC3
  text: Given a new device, when added, then the user sees a key-change notice and history on the old device is not silently
    exposed
- id: AC4
  text: Given lost keys, when the user recovers, then the UI states plainly that earlier messages may not be readable and
    never shows false success
