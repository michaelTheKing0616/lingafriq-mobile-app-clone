acceptance_criteria:
- id: AC1
  text: Given an assignment of a lesson, persona chapter or speaking task, when published, then each student sees it with
    a due date and class progress updates by can-do
- id: AC2
  text: Given a speaking submission, when auto-graded, then the score shows the scorer confidence and a visible 'unsure' state
    and never a fabricated number
- id: AC3
  text: Given a teacher override, when saved, then the override replaces the auto-grade, records the teacher and reason and
    the student sees both
- id: AC4
  text: Given progress by can-do, when shown, then it uses can-do statements and not raw minutes
- id: AC5
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
