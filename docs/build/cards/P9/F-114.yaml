acceptance_criteria:
- id: AC1
  text: Given an adult DM thread, when opened, then E2EE defaults on per MLS gate and encryption state is visible
- id: AC2
  text: Given contact info, when block or report is chosen, then actions complete in-app without unrouted dead ends
- id: AC3
  text: Given a composed message, when user requests check, then AI suggestion runs via gateway before send
- id: AC4
  text: Given messaging transport, when connected, then P0-4/5/6 socket defects are not present
- id: AC5
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
