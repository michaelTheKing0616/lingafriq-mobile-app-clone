acceptance_criteria:
- id: AC1
  text: Given labelled sets for Yoruba, Igbo, Hausa, Swahili, Zulu, Xhosa and for Pidgin/English, Sheng and Swahili/English
    code-switching, when the harness runs, then it reports precision, recall and false-positive rate per language and per
    code-switch pair
- id: AC2
  text: Given a language with fewer than 500 native-labelled examples, when evaluated, then the report marks it 'insufficient
    evidence' and the pipeline treats it as unsure rather than reporting a score
- id: AC3
  text: Given a release candidate, when recall on severe categories falls below the threshold set in the ADR for any supported
    language, then the harness exits non-zero and blocks the gate
- id: AC4
  text: Given the evaluation data, when stored, then labels come from native moderators and every example records annotator
    and licence
