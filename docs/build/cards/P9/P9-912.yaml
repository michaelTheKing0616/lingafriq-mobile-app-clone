acceptance_criteria:
- id: AC1
  text: Given a new sign-up, when the user enters a date of birth, then the server assigns exactly one tier (under-13, 13-15,
    16-17, adult) using the jurisdiction table reviewed by counsel and stores the tier, not the raw birth date beyond the
    retention schedule
- id: AC2
  text: Given the tier is under-13 or below the local digital-consent age, when sign-up continues, then the account is created
    in a pending-guardian state with no social, chat or purchase capability
- id: AC3
  text: Given a user who changes the entered date of birth after a failed gate, when they retry on the same device within
    24 h, then the original answer is kept and a typed AGE_RETRY_BLOCKED state is shown
- id: AC4
  text: Given any social endpoint, when called by an account without a tier, then it returns AGE_TIER_REQUIRED and no data
