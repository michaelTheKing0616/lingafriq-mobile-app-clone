acceptance_criteria:
- id: AC1
  text: Given a minor account, when created, then the profile is private, not searchable, and has no public feed presence,
    enforced server-side
- id: AC2
  text: Given a minor, when any API returns profile or post data, then it contains no location, no precise timezone and no
    contact-derived suggestions
- id: AC3
  text: Given a minor, when contact upload or phone-number lookup is called, then the endpoint returns CONTACT_DISCOVERY_DISABLED_FOR_MINORS
- id: AC4
  text: Given a minor trying to switch privacy to public, when submitted, then it is refused and the settings screen shows
    the locked state with a reason
