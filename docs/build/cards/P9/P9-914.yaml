acceptance_criteria:
- id: AC1
  text: Given a child asking to join a circle or classroom, when submitted, then a request appears in the guardian hub showing
    the group name, size, adult members count and moderation status
- id: AC2
  text: Given no guardian decision, when 7 days pass, then the request expires and the child is not added
- id: AC3
  text: Given guardian approval, when granted, then the child is added and the approval is revocable with immediate effect
- id: AC4
  text: Given a circle changing its membership rules after approval, when the change takes effect, then the guardian is notified
    and approval is re-requested
