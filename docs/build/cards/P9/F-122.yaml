acceptance_criteria:
- id: AC1
  text: Given an unverified user, when they attempt to publish corrections, then the action is blocked until native verification.
- id: AC2
  text: Given a learner submission, when a verified native corrects, then inline diff and optional audio reply are stored
    and shown.
- id: AC3
  text: Given a top correction with consent, when approved, then it can surface as a Living Dictionary usage example.
- id: AC4
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
