acceptance_criteria:
- id: AC1
  text: Given a voice note, when the recipient chooses transcribe, then the transcript appears with per-word gloss and a 'machine
    transcript' label
- id: AC2
  text: Given an E2EE voice note, when transcription is requested, then it runs on device or asks per-message consent to send
    audio to a server model
- id: AC3
  text: Given low-confidence audio, when transcribed, then uncertain words are marked and the UI never presents the transcript
    as exact
- id: AC4
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
