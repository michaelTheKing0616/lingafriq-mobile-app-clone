acceptance_criteria:
- id: AC1
  text: Given a learner posting a phrase or voice note, when submitted, then it appears in the corrections queue for verified
    natives of that language
- id: AC2
  text: Given a verified native, when correcting, then the correction is labelled with their verification and reputation score
    and the learner can mark it helpful
- id: AC3
  text: Given reputation, when computed, then it uses helpful marks and moderator reviews and is not shown for fewer than
    5 corrections
- id: AC4
  text: Given an accepted correction, when it conflicts with the content store, then it is routed to the content QA queue
    and nothing is auto-published
- id: AC5
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
    E-P9-SAFETY is Done, and the restriction is enforced server-side.
