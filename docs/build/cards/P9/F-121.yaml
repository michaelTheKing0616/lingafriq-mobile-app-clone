  text: Given a friend profile, when Gift is opened, then lesson, streak freeze, and cosmetic options are available with composer.
- id: AC3
  text: Given insufficient balance, when send is tapped, then an honest error explains why without faking success.
- id: AC4
  text: Given the account is under 18 or age-unknown, when this surface is opened, then it is hidden or guardian-gated until
