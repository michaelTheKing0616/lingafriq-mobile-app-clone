- id: AC2
  text: Given a finished round, when results appear, then the mastery screen lists skill deltas, mistakes with audio, and
    add-to-review actions.
- id: AC3
  text: Given any game completion, when the session ends, then learner model receives a verified play event without swallowed
    errors.
