acceptance_criteria:
- id: AC1
  text: Given a speaking game turn, when the learner records, then the score comes only from the E-P6-SCORER contract and
    no random, heuristic or length-based number is displayed
- id: AC2
  text: Given the scorer returns low confidence or 'unsure', when the verdict shows, then the game displays an unsure state,
    awards no score-based reward and offers retry
- id: AC3
  text: Given the scorer is unavailable or errors, when a turn needs a score, then the game shows a visible error and falls
    back to honest practice mode
- id: AC4
  text: Given a scored turn, when the result is stored, then the scorer version, confidence and per-phoneme or per-tone breakdown
    are stored with the learner-model event
- id: AC5
  text: Given a grep of speaking-game scoring code, when CI runs, then any use of Random, hash or fixed score in a speaking
    path fails the build
