acceptance_criteria:
- id: AC1
  text: Given a proverb, when a turn starts, then fragments are shown shuffled and the learner assembles them, then hears
    the whole proverb and picks the situation where it applies
- id: AC2
  text: Given the learner's level, when the game lists proverbs, then only B1+ learners see it by default and lower levels
    see a lock reason
- id: AC3
  text: Given a proverb record, when it enters the pool, then it must carry reviewed_by (elder or linguist) or it is excluded
- id: AC4
  text: Given proverb audio in a tonal language, when it plays, then it is a recording or tone-verified TTS and never unverified
    synthesis
- id: AC5
  text: Given Proverb Unlocker, when this card completes, then the GameKit rewrite is reachable here and its mechanics are
    carried or waived
