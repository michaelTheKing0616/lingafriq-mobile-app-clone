- id: AC1
  text: Given any GameKit game and a learner with N due items, when a session builds its turn queue, then due items fill the
    queue before any non-due item and the number of due items served is min(N, queue length)
- id: AC2
  text: Given a game with no retrieval or perception target declared in its manifest, when the game registers with GameKit,
    then registration fails with a typed GameManifestError and the game is not listed
- id: AC3
  text: Given a learner with zero due items, when a session starts, then items come from the learner's lowest-mastery skills
    and the session records source=fallback
- id: AC4
  text: Given the due-item query fails, when a session starts, then the game shows a visible retry state and never serves
    a hardcoded list
