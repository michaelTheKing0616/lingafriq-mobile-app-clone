delta:
  current_state: Three routed catalogues work; parallel unrouted language_games and lazy_list variants remain.
  defects_to_fix:
  - Three competing catalogues fragment discovery.
  - Play hub does not reliably update the learner model after sessions.
  elevation_to_build:
  - Single Arcade with skill shelves including For you today, Tone and Sound, Words, Grammar, Speaking, Culture, Traditional,
    Multiplayer, Classroom.
  - Each card shows trained skill and learner mastery; lazy loading retained.
  ux_and_render:
  - Shelf layout with unified game art, skill chips, New and Event ribbons.
  hub_placement: Play tab (root).
  unlock_stage: per §17.4
  harvest_list:
  - Route language_games_screen variants into the unified Arcade.
  - Keep lazy_game_list as the loading strategy inside one catalogue.
acceptance_criteria:
- id: AC1
  text: Given a signed-in learner, when they open Play, then one Arcade shows all shelves and no alternate catalogue route
    remains reachable.
- id: AC2
  text: Given a completed game session, when the learner returns to the Arcade, then mastery chips on that game reflect the
    learner model update.
- id: AC3
  text: Given lazy loading, when a shelf scrolls, then games load incrementally without blocking the Play tab.
