acceptance_criteria:
- id: AC1
  text: Given a trader with a scripted goal, when the round starts, then the learner must lower the price using numbers, politeness
    and bargaining phrases from the lexicon
- id: AC2
  text: 'Given a finished round, when scored, then the result shows three components: goal achieved, politeness, correctness,
    each from its own rubric'
- id: AC3
  text: Given a spoken turn, when pronunciation feedback is shown, then it comes only from the real scorer; otherwise the
    game is in practice mode
- id: AC4
  text: Given several trader personalities, when a learner replays, then a different or same trader can be chosen and each
    personality changes accepted prices and tone
- id: AC5
  text: Given the AI trader, when it speaks, then it is labelled as AI and routed through the AI gateway with budget limits
- id: AC6
  text: Given an impolite phrase, when detected by the rubric, then politeness drops and the explanation names the phrase
- id: AC7
  text: Given Market Bargaining, when this card completes, then every item in its harvest list is carried or waived
- id: AC8
  text: Given the scorer is unavailable or its confidence is below the gate threshold, when a score would be shown, then the
    UI shows the 'unsure' state, stores no number and never shows a fabricated score.
