acceptance_criteria:
- id: AC1
  text: Given a rolling window of the learner's last 10 turns in a game, when success is below 80%, then the next difficulty
    step is lowered by one level
- id: AC2
  text: Given a rolling window of 10 turns, when success is above 85%, then the next difficulty step is raised by one level
- id: AC3
  text: Given success is within 80–85%, when the next turn is chosen, then difficulty is unchanged
- id: AC4
  text: Given fewer than 10 turns of history, when a session starts, then difficulty starts from the learner's skill level
    in the learner model and the adapter does not adjust until 5 turns have resolved
- id: AC5
  text: Given simulated learners of fixed ability over 1000 sessions, when the adapter runs, then the mean success rate lands
    in 80–85% for every ability band
