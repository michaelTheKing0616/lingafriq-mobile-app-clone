acceptance_criteria:
- id: AC1
  text: Given duel mode before scorer ready, when the learner finishes, then no random 75–95% score appears and practice mode
    copy is shown.
- id: AC2
  text: Given scorer ready, when both players submit recordings, then winner uses verified pronunciation scores only.
- id: AC3
  text: Given under-18 account, when inviting a friend duel, then safety policies gate matchmaking before the invite sends.
- id: AC4
  text: Given the scorer is unavailable or its confidence is below the gate threshold, when a score would be shown, then the
    UI shows the 'unsure' state, stores no number and never shows a fabricated score.
