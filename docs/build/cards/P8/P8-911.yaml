acceptance_criteria:
- id: AC1
  text: Given a speaking game whose scorer is not live, when the game opens, then it runs in practice mode with a visible
    'Practice, not scored' label
- id: AC2
  text: Given practice mode, when a turn completes, then no score, accuracy percentage or pronunciation feedback is displayed
    and no XP, streak or league credit is issued
- id: AC3
  text: Given practice mode, when the learner records, then the recording may be replayed against the model audio but nothing
    claims correctness
- id: AC4
  text: Given the feature flag for the real scorer turns on, when a game opens, then practice mode is replaced only for games
    whose adapter test passes
