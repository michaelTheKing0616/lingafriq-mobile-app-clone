acceptance_criteria:
- id: AC1
  text: Given a learner's game history, when the Mastery Map opens, then it shows each skill and the games that changed it,
    derived only from learner-model events
- id: AC2
  text: Given a skill with no events, when shown, then it reads 'not measured'
- id: AC3
  text: Given a pronunciation or tone skill, when shown, then the value comes from the real scorer or reads 'not measured',
    never from practice mode
- id: AC4
  text: Given the map, when a learner taps a game, then it lists the sessions that moved that skill
- id: AC5
  text: Given the scorer is unavailable or its confidence is below the gate threshold, when a score would be shown, then the
    UI shows the 'unsure' state, stores no number and never shows a fabricated score.
