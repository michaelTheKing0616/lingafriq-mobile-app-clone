- id: AC2
  text: Given a correct choice, when feedback shows, then the avatar performs the matching gesture (kneel, bow or handshake
    style) for the language's culture
- id: AC3
  text: Given a scenario without a culturally verified answer, when the matrix builds, then it is excluded
- id: AC4
  text: Given a wrong choice, when the explanation shows, then it states why the greeting or gesture does not fit with audio
- id: AC5
  text: Given Greeting Diplomacy, when this card completes, then every item in its harvest list is carried or waived
