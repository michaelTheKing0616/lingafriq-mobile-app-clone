acceptance_criteria:
- id: AC1
  text: Given a finished session, when the client claims a reward, then the server recomputes XP from the stored turn log
    and ignores any client-supplied total
- id: AC2
  text: Given a claim whose turn log is missing, malformed or fails the plausibility checks, when submitted, then the server
    returns typed error GAME_REWARD_UNVERIFIED and awards nothing
- id: AC3
  text: Given the same session id claimed twice, when the second claim arrives, then no second reward is issued and the first
    result is returned
- id: AC4
  text: Given a session in practice mode, when claimed, then the reward is zero and the response states practice=true
- id: AC5
  text: Given a reward is issued, when the client renders it, then the shown number equals the server response
- id: AC6
  text: Given an unauthenticated or other-user claim, when submitted, then the server rejects with 401/403 and writes an audit
    entry
