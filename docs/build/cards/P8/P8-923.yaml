- id: AC1
  text: Given rapid conductor calls, when a stop name plays, then the learner taps to board the matching bus before the departure
    timer ends
- id: AC2
  text: Given the difficulty curve, when level rises, then call speed increases per speed_curve config and accents vary
- id: AC3
  text: Given audio for a call, when it is chosen, then it is a real recording with a speaker and accent tag; any item without
    a recording is excluded and TTS is never substituted
- id: AC4
  text: Given the recordings are not yet delivered, when the game opens, then it shows 'recordings coming' and is not in the
    headliner row
- id: AC5
  text: Given Taxi Survival, when this card completes, then every mechanic in its harvest list is carried or waived
