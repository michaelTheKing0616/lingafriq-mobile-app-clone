acceptance_criteria:
- id: AC1
  text: Given a wrong answer, when feedback shows, then an explanation names the error type from the error taxonomy and offers
    a play-audio control for the correct item
- id: AC2
  text: Given the correct item has no audio asset, when the explanation renders, then it shows an explicit 'no audio yet'
    state and never plays synthesised substitute audio for a tonal language
- id: AC3
  text: Given the learner replays the explanation audio, when playback starts, then it begins within 300 ms from cache or
    shows a loading state
- id: AC4
  text: Given a wrong answer, when the explanation is shown, then the error is also written as the typed error in the learner-model
    event
