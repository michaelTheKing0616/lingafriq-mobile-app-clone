acceptance_criteria:
- id: AC1
  text: Given a completed answer in any GameKit game, when the turn resolves, then exactly one learner-model event (item id,
    skill, correct/incorrect, error type, timestamp) is written before the next turn starts
- id: AC2
  text: Given an answer event, when it is written, then the item's SRS due date is updated by the same scheduler used in lesson
    practice
- id: AC3
  text: Given the device is offline, when turns resolve, then events queue durably and sync in order with no duplicates after
    reconnect
- id: AC4
  text: Given a session of K answered turns, when the session ends, then the learner model holds K events for that session
    id and a test fails if any game bypasses the writer
