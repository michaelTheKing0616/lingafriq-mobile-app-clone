acceptance_criteria:
- id: AC1
  text: Given a lexicon phrase with tone marks, when a turn starts, then its pitch contour is rendered on a talking-drum timbre
    and 2–4 candidate phrases are shown, one with matching tones
- id: AC2
  text: Given a candidate pick, when it is locally checked, then correct or wrong shows within 160 ms and the wrong-answer
    explanation plays the tones
- id: AC3
  text: Given a correct pick, when the production step starts, then the learner speaks the phrase and the real scorer's F0
    contour is drawn over the drum contour
- id: AC4
  text: Given the scorer returns unsure or is unavailable, when production ends, then the screen shows unsure or practice
    mode and issues no score-based reward
- id: AC5
  text: Given a language, when the tone set is needed, then the per-language tone inventory from P8-913 drives drum pitch
    levels and contours
- id: AC6
  text: Given a phrase without verified tone marks, when the pool builds, then it is excluded
- id: AC7
  text: Given Drum Word and Drum Rhythm, when this card completes, then every mechanic in the harvest list is present or the
    gap is listed and waived by Tope
