- id: AC1
  text: Given any GameKit session, when it starts, then its planned duration is between 60 and 180 s and the engine ends the
    session at 180 s at the latest
- id: AC2
  text: Given a game manifest, when it registers, then it declares exactly one core verb from the allowed verb list or registration
    fails with GameManifestError
- id: AC3
  text: Given a session reaches its planned end mid-turn, when the current turn resolves, then the results screen shows and
    no new turn begins
- id: AC4
  text: Given a registered game whose measured median session falls outside 60–180 s in telemetry, when the nightly report
    runs, then the game is flagged in the report
