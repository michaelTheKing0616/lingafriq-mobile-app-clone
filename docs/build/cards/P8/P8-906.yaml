acceptance_criteria:
- id: AC1
  text: Given a learner requests a duel, when the matchmaker pairs, then the two learners' level difference in the target
    skill is within the configured band and the band is stored in config, not code
- id: AC2
  text: Given no human is within the band after the wait limit, when the match times out, then the learner is offered a labelled
    bot or a retry and is never silently paired out of band
- id: AC3
  text: Given two learners in the same language, when paired, then both see the other's level label before the round starts
- id: AC4
  text: Given a request with a forged level, when the server matches, then the server uses its own learner-model level and
    ignores the client value
