acceptance_criteria:
- id: AC1
  text: Given a script set (Ge'ez, N'Ko, Adlam or Tifinagh), when a flight round starts, then the learner recognises and traces
    characters while flying
- id: AC2
  text: Given a stroke input, when recognised, then recognition runs on device with no network call and no stroke data is
    uploaded
- id: AC3
  text: Given recognition confidence is below threshold, when a character is traced, then the game shows an unsure state and
    lets the learner retry
- id: AC4
  text: Given the set of characters, when the pool builds, then each comes with a verified stroke order and sound from the
    script records
- id: AC5
  text: Given a script without a verified recogniser model, when the game opens, then that script is hidden with a 'not yet
    available' reason
