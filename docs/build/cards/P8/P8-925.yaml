acceptance_criteria:
- id: AC1
  text: Given a story circle, when it is a player's turn, then the player records one sentence continuing the story and it
    is stored under that story id
- id: AC2
  text: Given a recorded sentence, when checked, then the AI returns a grammar check with a suggested fix and the learner
    chooses to accept or keep it
- id: AC3
  text: Given a completed chain, when it ends, then it plays as an illustrated audio story assembled from the recorded sentences
    and approved illustrations
- id: AC4
  text: Given a classroom or circle, when a teacher or host creates a story, then members join by invite only
- id: AC5
  text: Given players under 18, when recordings are shared, then E-P9-SAFETY retention, moderation and consent rules apply
    before any sharing
- id: AC6
  text: Given the AI gateway fails, when a check is due, then a visible 'check unavailable' state shows and the sentence can
    still be kept
- id: AC7
  text: Given a sentence flagged by moderation, when the chain is assembled, then it is excluded from playback and the author
    is notified
