acceptance_criteria:
- id: AC1
  text: Given a minimal_pairs record in the lexicon, when a turn starts, then one of 2–4 near-identical words plays and the
    learner taps the matching picture
- id: AC2
  text: Given words with missing audio or picture, when the pool builds, then the set is excluded
- id: AC3
  text: Given a friend challenge, when sent, then the same item set is played asynchronously by both and the result posts
    when both finish
- id: AC4
  text: Given league standings, when computed, then rank uses accuracy first and speed only as a tiebreak
- id: AC5
  text: Given a learner under 18, when a challenge is created, then friend lists and matching follow the E-P9-SAFETY rules
- id: AC6
  text: Given a bot opponent, when used, then it is labelled per P8-908 and excluded from leagues
- id: AC7
  text: Given a wrong tap, when feedback shows, then the explanation plays the confused pair
