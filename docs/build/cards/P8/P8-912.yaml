acceptance_criteria:
- id: AC1
  text: Given any GameKit game, when it builds its pool, then items come from the lexicon query API and no game reads assets/data/game_content.json
    or a hardcoded 85–118-word list
- id: AC2
  text: Given a pool item without audio, when the game needs audio, then the item is excluded from audio-dependent games and
    logged, never served silent
- id: AC3
  text: Given a lexicon query returns fewer items than a session needs, when the game starts, then a typed GameContentFailure
    shows a visible message
- id: AC4
  text: Given a pool is built, when it is served, then each item carries id, language, tone-marked form, audio ref and licence
    tag
- id: AC5
  text: Given the old seed files, when this card completes, then no code path references them and a CI grep fails if one reappears
