acceptance_criteria:
- id: AC1
  text: Given a learner taps an answer, when the answer is locally verifiable, then correct/wrong feedback is visible within
    160 ms at p95 on the reference low-end device
- id: AC2
  text: Given an answer that needs a server or scorer round trip, when 160 ms passes, then a visible pending state shows and
    the final verdict replaces it without layout shift
- id: AC3
  text: Given a correct streak milestone, when celebration plays, then it lasts at most 1.5 s, is skippable by tap, and never
    blocks the next turn
- id: AC4
  text: Given reduced-motion is on, when celebration would play, then a static confirmation replaces it
