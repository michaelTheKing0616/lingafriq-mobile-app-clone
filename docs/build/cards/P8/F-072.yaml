delta:
  current_state: Routed from Arcade via game_router; content still uses the legacy 85–118 word pool without audio.
  defects_to_fix:
  - Thin static word pool without reliable audio.
  - No learner-model writeback after play.
  - Legacy per-game results instead of GameKit mastery.
  - Hard-coded UI strings bypass l10n.
  elevation_to_build:
  - Per-language tone inventories with minimal pairs and recorded audio.
  - Progress feeds the Tone Gym ladder with honest per-language rules.
  ux_and_render:
  - GameKit frame with unified illustration style and audio on every target-language item.
  - Reduced-motion variant respects system setting.
  hub_placement: Play → Tone & Sound shelf.
  unlock_stage: per §17.4
acceptance_criteria:
- id: AC1
  text: Given Swahili selected, when Tone Trainer loads, then no High-Mid-Low lexical tone UI is shown.
- id: AC2
  text: Given Igbo with downstep pairs, when a minimal pair plays, then scoring uses language-specific tone inventory not
    a global HML template.
- id: AC3
  text: Given session completion, when results show, then Tone Gym ladder progress updates from verified tone identification.
- id: AC4
  text: Given the scorer is unavailable or its confidence is below the gate threshold, when a score would be shown, then the
    UI shows the 'unsure' state, stores no number and never shows a fabricated score.
