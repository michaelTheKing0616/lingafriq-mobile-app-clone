acceptance_criteria:
- id: AC1
  text: Given a short song, rhyme or praise phrase, when a round starts, then the lyric scrolls with the target pitch line
    and the learner sings or chants along
- id: AC2
  text: Given the microphone input, when the learner sings, then a live line from real F0 tracking is drawn against the target
    line
- id: AC3
  text: Given the score is shown, when the round ends, then rhythm, tone and fluency scores come from the E-P6-SCORER contract
    only; unsure or unavailable shows practice mode
- id: AC4
  text: Given a song in the catalogue, when it is listed, then it carries a licence record (licensed or commissioned) and
    unlicensed songs are not shown
- id: AC5
  text: Given no licensed music is delivered yet, when the game opens, then it shows 'songs coming' and uses only licence-cleared
    content
- id: AC6
  text: Given Pronunciation Karaoke, when this card completes, then every item in its harvest list is carried or waived
