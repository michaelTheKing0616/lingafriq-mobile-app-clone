acceptance_criteria:
- id: AC1
  text: Given a word in a tonal language, when a tone game builds its answer, then the correct tone sequence comes from that
    word's lexicon tone-marked form and not from one global H/M/L rule
- id: AC2
  text: Given a language, when the tone game loads, then the tone inventory (number and names of tones, contour tones where
    they exist) comes from the language's inventory record
- id: AC3
  text: Given a word whose lexicon tone record is missing or flagged unverified, when the pool builds, then the word is excluded
    and counted in a diagnostics line
- id: AC4
  text: Given the previous tone_trainer one-model logic, when this card completes, then it is deleted and a test fails if
    a tone game hardcodes a tone set
