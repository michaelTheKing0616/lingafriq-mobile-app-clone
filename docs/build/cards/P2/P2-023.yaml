acceptance_criteria:
- id: AC1
  text: Given a login, when a token is issued, then it is EdDSA or RS256 signed with a kid and expires in 10 to 15 minutes
- id: AC2
  text: Given a rotated signing key, when an old-kid token within validity arrives, then it verifies against the published
    key set and unknown kid is rejected
- id: AC3
  text: Given HTTP and socket auth, when verifying tokens, then one shared verifier is used and no code reads the shared secret
- id: AC4
  text: Given a trailing newline in any key env var, when the service boots, then the value is normalised once at config load
    or boot fails loud
- id: AC5
  text: Given HS256 tokens, when presented after cutover, then they are rejected with a typed 401
