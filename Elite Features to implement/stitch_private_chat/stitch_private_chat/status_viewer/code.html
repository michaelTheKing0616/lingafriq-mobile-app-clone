<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

              "label": ["Lexend"]

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .status-gradient-overlay {
            background: linear-gradient(to bottom, rgba(45,22,0,0.6) 0%, rgba(45,22,0,0) 25%, rgba(45,22,0,0) 60%, rgba(45,22,0,0.8) 100%);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-on-background font-body overflow-hidden h-screen w-screen flex flex-col">
<!-- Status Background & Content Area -->
<div class="relative flex-1 w-full overflow-hidden">
<!-- Main Landmark Image -->
<img alt="The Great Mosque of Djenné" class="absolute inset-0 w-full h-full object-cover" data-alt="vibrant photo of the Great Mosque of Djenné at sunset with warm orange lighting hitting the mud brick towers and a clear sky" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBfZuUtSBT4RyiZ0n7y8YI19dYo-68J_MkjvAK4E1Bc_9JDrKh2mfp2KSXsTr8y4xASZ_DzbT4tZ64WHEV6MTs6J0R5qj_FP5iWGBJDMSvfs8DqJQHpng5VUIQeQVDEul-Vjg1Su9B8gOs4WUVC0YEnHJM9rIdqtuwU6rIZSxq1AsIOemTPJ9v2Tu8zg6shIfvX-cIyAgyKo6V4G_3zbooCkMjPa7KbEyiC3qEKnjX-utDRL5dvT1NYlJOusPB7A4uaGBXFM2YL2mSk"/>
<!-- Gradient Overlay for Contrast -->
<div class="absolute inset-0 status-gradient-overlay"></div>
<!-- Top Progress Indicators (Shell-like) -->
<div class="absolute top-0 left-0 w-full px-4 pt-4 z-50">
<div class="flex gap-1.5 mb-4">
<div class="h-1 flex-1 bg-white/30 rounded-full overflow-hidden">
<div class="h-full bg-white w-full"></div>
</div>
<div class="h-1 flex-1 bg-white/30 rounded-full overflow-hidden">
<div class="h-full bg-white w-2/3"></div>
</div>
<div class="h-1 flex-1 bg-white/30 rounded-full"></div>
<div class="h-1 flex-1 bg-white/30 rounded-full"></div>
</div>
<!-- Header Info -->
<div class="flex items-center justify-between">
<div class="flex items-center gap-3">
<div class="w-10 h-10 rounded-full border-2 border-primary-fixed overflow-hidden">
<img alt="User profile avatar" class="w-full h-full object-cover" data-alt="portrait of a smiling West African woman wearing a colorful headscarf and gold earrings with a soft bokeh background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD6m0ISHJs9BRNVv7yAFRzQ41VvJmtG9ut3AxKa9wlzHFlpjtP8B-FH_gsl0-qXQVSSpkRmJflAZVRU4c0jtw5Wanjt0BdD9GSC0Uu_4kmAw4qWbtMy_Ly1DpApZgnk9jRPZV9SMfCOk8X6kdxEtPgdCUVHizY0rj0AnGFeEycBRYQ3WCE3f_QQdX8g6CYXUj7LezlesorcM5OBYG9BGttDzfI-voxXknFZql_ko0jgGabB99V7FH0_7zxmzPmFXPKPae08LNFv2AvP"/>
</div>
<div>
<p class="text-white font-headline font-bold text-sm tracking-tight">Fatou_Wolof</p>
<p class="text-white/70 text-[10px] font-medium">Village Guide • 2h ago</p>
</div>
</div>
<div class="flex items-center gap-2">
<button class="p-2 text-white hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
<button class="p-2 text-white hover:bg-white/10 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="close">close</span>
</button>
</div>
</div>
</div>
<!-- Central Language Content -->
<div class="absolute inset-0 flex flex-col items-center justify-center px-8 text-center pointer-events-none">
<div class="bg-surface-container-highest/10 backdrop-blur-md p-8 rounded-lg border border-white/10 max-w-sm">
<h1 class="font-headline font-extrabold text-4xl text-white mb-4 tracking-tight">
                    Dëkk bi neex na
                </h1>
<p class="font-body text-xl text-primary-fixed font-semibold mb-6 italic tracking-wide">
                    /dekk bee nekh nah/
                </p>
<div class="bg-surface-container-lowest/15 py-3 px-6 rounded-full inline-block backdrop-blur-sm">
<p class="text-white font-medium text-lg">
                        The village is beautiful
                    </p>
</div>
</div>
<!-- Floating Tribe Totem Achievement Overlap -->
<div class="mt-8 bg-tertiary-fixed text-on-tertiary-fixed px-5 py-2 rounded-full font-bold flex items-center gap-2 shadow-xl transform -rotate-3 hover:rotate-0 transition-transform pointer-events-auto cursor-default">
<span class="material-symbols-outlined" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                Daily Wolof Explorer
            </div>
</div>
<!-- Bottom Reply Section -->
<div class="absolute bottom-0 left-0 w-full px-4 pb-8 pt-12">
<!-- Emoji Reactions Row -->
<div class="flex justify-center gap-4 mb-6">
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-lg flex items-center justify-center text-2xl hover:bg-white/20 hover:scale-110 active:scale-90 transition-all">❤️</button>
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-lg flex items-center justify-center text-2xl hover:bg-white/20 hover:scale-110 active:scale-90 transition-all">🔥</button>
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-lg flex items-center justify-center text-2xl hover:bg-white/20 hover:scale-110 active:scale-90 transition-all">👏</button>
<button class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-lg flex items-center justify-center text-2xl hover:bg-white/20 hover:scale-110 active:scale-90 transition-all">😮</button>
</div>
<!-- Reply Input Field -->
<div class="flex items-center gap-3">
<div class="flex-1 relative">
<input class="w-full bg-white/10 backdrop-blur-xl border border-white/20 rounded-full py-3.5 px-6 text-white placeholder:text-white/50 focus:outline-none focus:ring-2 focus:ring-primary-fixed/50 transition-all" placeholder="Reply to Fatou..." type="text"/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 flex items-center gap-2">
<button class="text-white/60 hover:text-white">
<span class="material-symbols-outlined" data-icon="gif_box">gif_box</span>
</button>
</div>
</div>
<button class="w-12 h-12 rounded-full bg-primary-fixed text-on-primary-fixed flex items-center justify-center shadow-lg active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="send" style="font-variation-settings: 'FILL' 1;">send</span>
</button>
</div>
</div>
<!-- Navigation Side Buttons (Invisible Tap areas) -->
<div class="absolute inset-y-0 left-0 w-1/4 z-10 cursor-pointer group">
<div class="absolute inset-y-0 left-0 w-12 bg-gradient-to-r from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-white/50" data-icon="chevron_left">chevron_left</span>
</div>
</div>
<div class="absolute inset-y-0 right-0 w-1/4 z-10 cursor-pointer group">
<div class="absolute inset-y-0 right-0 w-12 bg-gradient-to-l from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
<span class="material-symbols-outlined text-white/50" data-icon="chevron_right">chevron_right</span>
</div>
</div>
</div>
<!-- Hidden Contextual Navigation Suppression Logic Applied: No BottomNavBar or TopAppBar shown as this is a task-focused full-screen focused journey -->
</body></html>
