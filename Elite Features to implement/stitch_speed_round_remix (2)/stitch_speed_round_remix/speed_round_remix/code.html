<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Speed Round Remix - The Polyglot Atelier</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-tertiary": "#ffffff",
                        "secondary-fixed": "#70f8e8",
                        "outline-variant": "#c5c5d4",
                        "on-secondary-fixed-variant": "#005049",
                        "on-tertiary-fixed-variant": "#683d00",
                        "on-primary-fixed-variant": "#0031c4",
                        "surface-dim": "#d9dadb",
                        "inverse-on-surface": "#f0f1f2",
                        "surface-variant": "#e1e3e4",
                        "inverse-primary": "#bac3ff",
                        "on-error-container": "#93000a",
                        "surface-container": "#edeeef",
                        "surface-tint": "#2e4edc",
                        "tertiary-container": "#834e00",
                        "on-surface-variant": "#454652",
                        "on-error": "#ffffff",
                        "surface-bright": "#f8f9fa",
                        "on-background": "#191c1d",
                        "error-container": "#ffdad6",
                        "tertiary": "#633900",
                        "on-surface": "#191c1d",
                        "surface-container-high": "#e7e8e9",
                        "surface-container-low": "#f3f4f5",
                        "on-secondary": "#ffffff",
                        "secondary-fixed-dim": "#4fdbcc",
                        "secondary": "#006a62",
                        "on-secondary-container": "#007168",
                        "on-secondary-fixed": "#00201d",
                        "surface": "#f8f9fa",
                        "primary-container": "#284ad8",
                        "tertiary-fixed": "#ffdcbc",
                        "outline": "#757684",
                        "primary-fixed": "#dee1ff",
                        "secondary-container": "#70f8e8",
                        "primary-fixed-dim": "#bac3ff",
                        "on-primary-fixed": "#001159",
                        "primary": "#002fbb",
                        "error": "#ba1a1a",
                        "background": "#f8f9fa",
                        "tertiary-fixed-dim": "#ffb86b",
                        "on-tertiary-fixed": "#2c1700",
                        "surface-container-lowest": "#ffffff",
                        "on-primary": "#ffffff",
                        "inverse-surface": "#2e3132",
                        "surface-container-highest": "#e1e3e4",
                        "on-primary-container": "#c9d0ff",
                        "on-tertiary-container": "#ffc890"
                    },
                    fontFamily: {
                        "headline": ["Plus Jakarta Sans"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    },
                    borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" },
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .timer-pulse {
            box-shadow: 0 0 0 0 rgba(186, 26, 26, 0.4);
            animation: pulse 1.5s infinite cubic-bezier(0.66, 0, 0, 1);
        }
        @keyframes pulse {
            to { box-shadow: 0 0 0 20px rgba(186, 26, 26, 0); }
        }
        .speed-gradient {
            background: linear-gradient(135deg, #f8f9fa 0%, #dee1ff 50%, #f8f9fa 100%);
            background-size: 400% 400%;
            animation: speedFlow 15s ease infinite;
        }
        @keyframes speedFlow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background font-body text-on-background min-h-screen overflow-hidden speed-gradient">
<!-- TopAppBar Shell (Customized for Speed Round) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-6 py-4 bg-white/80 dark:bg-slate-900/80 backdrop-blur-xl shadow-[0_24px_24px_-4px_rgba(63,81,181,0.06)]">
<div class="flex items-center gap-4">
<button class="p-2 rounded-full hover:bg-indigo-50 transition-colors active:scale-95">
<span class="material-symbols-outlined text-indigo-700">close</span>
</button>
<span class="font-headline font-bold text-indigo-700 tracking-tight text-xl hidden sm:block">The Polyglot Atelier</span>
</div>
<!-- Timer Central Anchor -->
<div class="absolute left-1/2 -translate-x-1/2 flex flex-col items-center">
<div class="timer-pulse w-14 h-14 rounded-full bg-error flex items-center justify-center border-4 border-error-container">
<span class="font-headline font-extrabold text-on-error text-xl">15</span>
</div>
<span class="text-[10px] font-bold text-error uppercase tracking-widest mt-1">Seconds</span>
</div>
<div class="flex items-center gap-3">
<div class="bg-tertiary-fixed px-3 py-1 rounded-full flex items-center gap-1 shadow-sm">
<span class="text-on-tertiary-fixed font-bold">5 🔥</span>
</div>
</div>
</header>
<main class="relative pt-32 pb-12 px-6 max-w-2xl mx-auto flex flex-col min-h-screen items-center justify-center">
<!-- Feedback Floating Streaks -->
<div class="absolute top-40 right-10 sm:right-20 pointer-events-none">
<div class="flex flex-col gap-4">
<span class="text-primary font-headline font-extrabold text-3xl opacity-0 animate-[bounce_1s_ease-in-out_infinite] delay-100">+5</span>
<span class="text-secondary font-headline font-extrabold text-4xl animate-pulse">+10</span>
</div>
</div>
<!-- Central Game Area -->
<div class="w-full space-y-8">
<!-- Learning Card: The "Academic Playground" Editorial Style -->
<div class="bg-surface-container-lowest rounded-[2rem] p-10 shadow-[0_24px_48px_-12px_rgba(63,81,181,0.08)] relative overflow-hidden group">
<!-- Tonal shift background element -->
<div class="absolute top-0 right-0 w-32 h-32 bg-primary-fixed/30 rounded-bl-[4rem] -mr-8 -mt-8 transition-transform group-hover:scale-110 duration-500"></div>
<div class="relative z-10 flex flex-col items-center text-center space-y-12">
<div class="space-y-2">
<span class="text-slate-400 font-label font-semibold tracking-widest uppercase text-xs">Target Phrase</span>
<h1 class="text-5xl sm:text-7xl font-headline font-extrabold text-on-surface tracking-tighter">Bibliothèque</h1>
</div>
<div class="w-24 h-1 bg-surface-variant/30 rounded-full"></div>
<div class="space-y-2">
<span class="text-slate-400 font-label font-semibold tracking-widest uppercase text-xs">Translation Attempt</span>
<p class="text-3xl font-body text-primary font-medium italic">A quiet place for books</p>
</div>
</div>
</div>
<!-- Rapid Fire Action Buttons -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-6 w-full">
<!-- Correct / True Option -->
<button class="relative group flex items-center justify-center py-8 rounded-[1.5rem] bg-gradient-to-br from-primary to-primary-container shadow-[0_12px_24px_-8px_rgba(0,47,187,0.3)] active:scale-[0.96] transition-all duration-200">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-headline font-bold text-2xl text-on-primary">Correct</span>
</div>
</button>
<!-- Incorrect / False Option -->
<button class="relative group flex items-center justify-center py-8 rounded-[1.5rem] bg-surface-container-low border-2 border-transparent hover:border-outline-variant/20 active:scale-[0.96] transition-all duration-200">
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-error text-4xl">cancel</span>
<span class="font-headline font-bold text-2xl text-on-surface">Incorrect</span>
</div>
</button>
</div>
</div>
<!-- Bottom Progress Anchor -->
<div class="mt-16 w-full max-w-md space-y-4">
<div class="flex justify-between items-end mb-2">
<span class="font-label font-bold text-indigo-700 text-sm">Round Progress</span>
<span class="font-label font-bold text-indigo-900 text-lg">12/20</span>
</div>
<div class="h-4 w-full bg-surface-container-highest rounded-full overflow-hidden shadow-inner p-1">
<div class="h-full w-3/5 bg-gradient-to-r from-secondary to-secondary-fixed-dim rounded-full relative">
<div class="absolute inset-0 bg-white/20 animate-pulse"></div>
<!-- Pulse glow for active progress -->
<div class="absolute right-0 top-0 bottom-0 w-4 shadow-[0_0_15px_rgba(79,219,204,0.8)]"></div>
</div>
</div>
</div>
</main>
<!-- Suppressed Nav Shell for Focus Mode (Only keeping subtle decorative corner) -->
<footer class="fixed bottom-0 left-0 w-full z-40 pointer-events-none">
<div class="h-32 bg-gradient-to-t from-background to-transparent w-full"></div>
</footer>
<!-- Decorative Image Patterns for High-End Feel -->
<div class="fixed top-1/4 -left-20 w-64 h-64 bg-secondary-fixed/10 blur-[100px] rounded-full -z-10"></div>
<div class="fixed bottom-1/4 -right-20 w-80 h-80 bg-primary-fixed/10 blur-[120px] rounded-full -z-10"></div>
</body></html>
