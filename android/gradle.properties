org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=true
# Pin NDK for CI determinism (plugins require different versions; highest is backward compatible).
android.ndkVersion=27.0.12077973

# Suppress NDK minSdk version error for NDK 26.1.10909125
# NDK 26.1.10909125 requires minSdk 21+, but some plugins may have lower minSdk
# This allows the build to proceed with minSdk 21 (which we enforce in build.gradle)
android.ndk.suppressMinSdkVersionError=21

# Suppress package attribute warnings in AndroidManifest.xml
# Some plugins (like flutter_vibrate) still use the deprecated package attribute
# We handle this by setting namespace explicitly in build.gradle
android.suppressUnsupportedCompileSdk=36

# Skip AAR metadata validation for excluded project modules
# flutter_webrtc and workmanager are excluded from build but still in dependency graph
# This property tells the AAR metadata check to skip validation for these modules
android.enableAarMetadata=true

# Note: android.disableAutomaticComponentCreation was removed in AGP 8.0+
# Modern Android Gradle Plugin handles component creation automatically
# No configuration needed for component creation

# Repository configuration for better reliability
org.gradle.dependency.verification=off
# Enable parallel downloads
org.gradle.parallel=true
org.gradle.caching=true
# Configure repository retry behavior
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
# Retry failed downloads
systemProp.http.maxRedirects=5
# Use system proxy if available
systemProp.http.proxyHost=
systemProp.http.proxyPort=
systemProp.https.proxyHost=
systemProp.https.proxyPort=
# Disable SSL verification issues (use with caution)
systemProp.javax.net.ssl.trustStore=
systemProp.javax.net.ssl.trustStorePassword=
# Force repository refresh on failure
org.gradle.configuration-cache=false
# Use init script for repository configuration
org.gradle.init.daemon=true

# CMake configuration for native builds (required by rive_common)
# CMake will be installed via CI/CD or can be specified via cmake.dir property
# If CMake is installed via Android SDK, it will be auto-detected
# For CI/CD, ensure CMake 3.22.1+ is installed