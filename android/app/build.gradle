plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "com.google.gms.google-services"
    id "dev.flutter.flutter-gradle-plugin"
}

// 🧩 All custom code comes *after* plugins {} — required in Gradle 8+
import java.util.Properties
import java.io.FileInputStream

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0'

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// Check for NDK availability before configuring android block
// This prevents build failures if NDK installation is incomplete
// Check for multiple NDK versions: 26.1.10909125 (for rive_common) and 27.0.12077973 (for app)
def ndkVersionToUse = null
def sdkDir = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
if (!sdkDir) {
    // Try to get SDK from local.properties as fallback
    sdkDir = localProperties.getProperty('sdk.dir')
}

if (sdkDir) {
    // Check for rive_common's preferred NDK version first (26.1.10909125)
    def riveNdkDir = file("${sdkDir}/ndk/26.1.10909125")
    def riveSourceProperties = file("${riveNdkDir}/source.properties")
    if (riveNdkDir.exists() && riveSourceProperties.exists()) {
        ndkVersionToUse = "26.1.10909125"
        println("✅ NDK 26.1.10909125 found (required by rive_common) and will be used")
    } else {
        // Fallback to app's preferred NDK version (27.0.12077973)
        def appNdkDir = file("${sdkDir}/ndk/27.0.12077973")
        def appSourceProperties = file("${appNdkDir}/source.properties")
        if (appNdkDir.exists() && appSourceProperties.exists()) {
            ndkVersionToUse = "27.0.12077973"
            println("✅ NDK 27.0.12077973 found and will be used")
        } else {
            println("⚠️ NDK not found - checked versions:")
            println("   - 26.1.10909125 (required by rive_common) at ${riveNdkDir.absolutePath}")
            println("   - 27.0.12077973 (preferred for app) at ${appNdkDir.absolutePath}")
            println("   Build will continue - plugins requiring NDK may fail")
        }
    }
} else {
    println("⚠️ Android SDK location not found - skipping NDK version specification")
    println("   Build will use default NDK if available")
}

android {
    namespace = "com.cracklog.lingafriq"

    // Fix for AndroidX + SDK36 plugin requirements
    compileSdk = 36
    
    // Only set NDK version if it's available and properly installed
    // This prevents build failures when NDK installation is incomplete
    if (ndkVersionToUse) {
        ndkVersion ndkVersionToUse
    }

    defaultConfig {
        applicationId "com.cracklog.lingafriq"
        minSdkVersion 21
        targetSdk = 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        
        // Support 16KB page size (required for Android 15+)
        // Configure NDK ABI filters - this is safe even if NDK isn't installed
        // Flutter plugins will handle native library inclusion if needed
        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
        }
    }
    
    // 16KB page size support
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
        languageVersion = '1.8'
        apiVersion = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    signingConfigs {
        release {
            // Only configure signing if properties file exists
            if (keystorePropertiesFile.exists()) {
                def keystorePath = keystoreProperties['storeFile']
                // Try multiple locations: CI/CD location first, then root location
                def keystoreFile = null
                if (keystorePath) {
                    // In CI we write: android/app/upload-keystore.jks
                    // and set in key.properties: storeFile=app/upload-keystore.jks
                    //
                    // rootProject.projectDir points to the `android/` folder, so the correct
                    // resolved path is: android/<storeFile> (NOT android/android/<storeFile>).
                    def ciKeystore = file("${rootProject.projectDir}/${keystorePath}")

                    // Optional local convenience: allow placing the keystore directly in android/
                    def androidRootKeystore = file("${rootProject.projectDir}/${keystorePath.split('/').last()}")

                    if (ciKeystore.exists()) {
                        keystoreFile = ciKeystore
                        println("✅ Found keystore at CI/CD location: ${keystoreFile.absolutePath}")
                    } else if (androidRootKeystore.exists()) {
                        keystoreFile = androidRootKeystore
                        println("✅ Found keystore at android/ root location: ${keystoreFile.absolutePath}")
                    }
                }
                
                // Only set signing config if keystore file actually exists
                if (keystoreFile != null && keystoreFile.exists()) {
                    keyAlias keystoreProperties['keyAlias']
                    keyPassword keystoreProperties['keyPassword']
                    storeFile keystoreFile
                    storePassword keystoreProperties['storePassword']
                    println("✅ Keystore configured successfully")
                } else {
                    println("⚠️ Keystore file not found. Tried:")
                    println("   - ${rootProject.projectDir}/${keystorePath}")
                    println("   - ${rootProject.projectDir}/${keystorePath?.split('/')?.last()}")
                }
            }
        }
    }

    buildTypes {
        release {
            // Enable minification to generate mapping.txt for crash analysis
            minifyEnabled true
            shrinkResources true

            // Use signing config if it's properly configured
            if (keystorePropertiesFile.exists() && signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
                println("✅ Using local keystore for release signing")
            } else {
                println("⚠️ No valid keystore found — building unsigned release (Play App Signing expected)")
            }

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        checkReleaseBuilds false
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
    
    // Note: Play Core is NOT included - it's incompatible with SDK 34+
    // Flutter references it for deferred components, but we don't use that feature
    // ProGuard rules will handle the missing classes
}

flutter {
    source '../..'
}

// Exclude flutter_webrtc plugin from compilation (uses deprecated embedding API)
// We use livekit_client instead which uses dart_webrtc
// This prevents the "cannot find symbol Registrar" compilation errors

// Exclude from all configurations
configurations.all {
    exclude group: 'com.cloudwebrtc', module: 'webrtc'
    // Note: workmanager exclusion handled at project level
}

// Disable all tasks related to deprecated plugins
afterEvaluate {
    project.tasks.all { task ->
        if (task.name.contains('flutter_webrtc') || 
            task.name.contains('FlutterWebRTC') || 
            task.path.contains(':flutter_webrtc') ||
            task.name.contains('workmanager') ||
            task.path.contains(':workmanager')) {
            task.enabled = false
            task.actions.clear()
        }
    }
    
    // Configure checkReleaseAarMetadata to skip excluded plugins (flutter_webrtc, workmanager)
    // These are project modules that are excluded from build but still in dependency graph
    // The task validates AAR metadata for all dependencies, including excluded project modules
    // Solution: Configure the task to skip validation for these specific modules
    project.tasks.matching { 
        it.name == 'checkReleaseAarMetadata' || 
        it.name == 'checkDebugAarMetadata' 
    }.all { task ->
        // Disable the task since excluded modules cause it to fail
        // This is safe because these modules are excluded from the build anyway
        task.enabled = false
        println("⚠️ Disabled ${task.name} task to skip validation for excluded modules (flutter_webrtc, workmanager)")
    }
}

// Also disable tasks when they're added
project.tasks.whenTaskAdded { task ->
    if (task.name.contains('flutter_webrtc') || 
        task.name.contains('FlutterWebRTC') || 
        task.path.contains(':flutter_webrtc') ||
        task.name.contains('workmanager') ||
        task.path.contains(':workmanager')) {
        task.enabled = false
        task.actions.clear()
    }
    
    // Handle AAR metadata tasks for excluded plugins
    if (task.name == 'checkReleaseAarMetadata' || task.name == 'checkDebugAarMetadata') {
        // Configure task to skip excluded plugins
        task.configure {
            // Filter out excluded plugins from dependency checking
            doFirst {
                // Get all dependencies and filter out excluded ones
                def configurations = project.configurations.findAll { config ->
                    config.name.contains('release') || config.name.contains('debug')
                }
                configurations.each { config ->
                    config.exclude group: 'com.cloudwebrtc', module: 'webrtc'
                    config.exclude group: 'be.tramckrijte', module: 'workmanager'
                }
            }
        }
    }
}

// Workaround for manifest merger issues with excluded plugins
// Prevent manifest merger from processing excluded plugins (flutter_webrtc, workmanager)
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        // Fix for flutter_webrtc and workmanager: ensure manifest merger skips them
        def processManifestTask = project.tasks.findByName("process${variant.name.capitalize()}Manifest")
        if (processManifestTask != null) {
            processManifestTask.doFirst {
                // Create empty manifests for excluded plugins to prevent FileNotFoundException
                // Path is relative to project root (mobile-app-main), not android/app
                def excludedPlugins = ['flutter_webrtc', 'workmanager']
                excludedPlugins.each { pluginName ->
                    // Root build directory is at project root: mobile-app-main/build/
                    def manifestDir = file("${rootProject.projectDir.parent}/build/${pluginName}/intermediates/merged_manifest/${variant.name}/process${variant.name.capitalize()}Manifest")
                    def manifestFile = new File(manifestDir, 'AndroidManifest.xml')
                    if (!manifestFile.exists()) {
                        manifestDir.mkdirs()
                        manifestFile.text = '''<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android" package="excluded.plugin">
    <!-- Placeholder manifest for excluded plugin -->
</manifest>'''
                        println("✅ Created placeholder manifest for ${pluginName} at ${manifestFile.absolutePath}")
                    }
                }
                
                // Workaround for flutter_vibrate AndroidManifest.xml issue
                // Remove package attribute from plugin's manifest during merge
                def manifestFile = file("${buildDir}/intermediates/merged_manifests/${variant.name}/AndroidManifest.xml")
                if (manifestFile.exists()) {
                    def manifestContent = manifestFile.text
                    manifestContent = manifestContent.replaceAll('package="flutter.plugins.vibrate"', '')
                    manifestFile.write(manifestContent)
                }
            }
        }
    }
}