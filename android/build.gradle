// Top-level build file for LingAfriq (Gradle 8.6 / Kotlin 2.x compatible)

buildscript {
    ext {
        // Kotlin 2.x drops support for languageVersion 1.4, and some transitive
        // Flutter plugins (e.g. sentry_flutter) still request 1.4, causing CI failures:
        //   "Language version 1.4 is no longer supported; please, use version 1.8 or greater."
        // Use a stable Kotlin 1.9 line for maximum plugin compatibility.
        kotlin_version = '1.9.24'
        agp_version = '8.6.0'     // ✅ Android Gradle Plugin (works with Flutter 3.35+)
        gms_version = '4.4.2'     // ✅ Google Services plugin
    }

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "com.google.gms:google-services:$gms_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// ✅ Ensure clean build directory structure
rootProject.buildDir = '../build'

subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                // ✅ Ensure every submodule has a namespace (Gradle 8+ requirement)
                if (!namespace) {
                    namespace project.group
                }
            }
        }
    }

    // ✅ Kotlin 2.x no longer supports languageVersion 1.4.
    // Some transitive plugins may still set 1.4 explicitly, causing CI failures:
    //   "Language version 1.4 is no longer supported; please, use version 1.8 or greater."
    // Force a safe minimum across all KotlinCompile tasks.
    afterEvaluate { project ->
        try {
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    // Keep consistent with our app's Java/Kotlin toolchain.
                    jvmTarget = '17'
                    languageVersion = '1.8'
                    apiVersion = '1.8'
                }
            }
        } catch (Throwable ignored) {
            // Module may not apply Kotlin; ignore.
        }
    }

    // Keep each module’s build output organized under root /build/
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

// ✅ Clean task
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
