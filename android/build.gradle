// Top-level build file for LingAfriq (Gradle 8.6 / Kotlin 2.x compatible)

buildscript {
    ext {
        kotlin_version = '2.2.0' // ✅ Upgrade to Kotlin 2.x (1.9.x soon unsupported)
        agp_version = '8.6.0'     // ✅ Android Gradle Plugin (works with Flutter 3.35+)
        gms_version = '4.4.2'     // ✅ Google Services plugin
    }

    repositories {
        // Try Google first (often has better availability)
        google()
        mavenCentral()
        // Add alternative repositories for better reliability
        maven { url 'https://jitpack.io' }
        maven { url 'https://repo1.maven.org/maven2' }
        gradlePluginPortal()
    }

    dependencies {
        classpath "com.android.tools.build:gradle:$agp_version"
        classpath "com.google.gms:google-services:$gms_version"
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        // Try Google first (often has better availability and mirrors)
        google()
        // Add Maven Central with explicit URL as fallback
        mavenCentral()
        maven { url 'https://repo1.maven.org/maven2' }
        // Add alternative repositories for better reliability
        maven { url 'https://jitpack.io' }
        maven { url 'https://oss.sonatype.org/content/repositories/snapshots' }
        // Aliyun mirror (often more reliable in CI/CD environments)
        maven { url 'https://maven.aliyun.com/repository/public' }
    }
}

// ✅ Ensure clean build directory structure
rootProject.buildDir = '../build'

// Exclude flutter_webrtc project before it's evaluated
gradle.beforeProject { project ->
    if (project.name == 'flutter_webrtc') {
        project.tasks.configureEach { task ->
            task.enabled = false
        }
    }
}

subprojects {
    afterEvaluate { project ->
        // Exclude flutter_webrtc plugin entirely (uses deprecated embedding API)
        if (project.name == 'flutter_webrtc') {
            project.tasks.all { task ->
                task.enabled = false
            }
            return
        }
        
        if (project.hasProperty('android')) {
            project.android {
                // ✅ Ensure every submodule has a namespace (Gradle 8+ requirement)
                if (!namespace) {
                    namespace project.group
                }
                
                // ✅ Enforce Java 17 for all subprojects to match Kotlin JVM target
                // This fixes JVM target compatibility issues between Java and Kotlin
                compileOptions {
                    sourceCompatibility JavaVersion.VERSION_17
                    targetCompatibility JavaVersion.VERSION_17
                }
            }
        }
        
        // ✅ Enforce minimum Kotlin language version 1.8 (required by Kotlin 2.2.0 compiler)
        // and JVM target 17 for all subprojects
        // Use lenient compiler settings to support older plugin source code
        project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
            kotlinOptions {
                languageVersion = '1.8'
                apiVersion = '1.8'
                jvmTarget = '17'
                // Use lenient compiler flags for better compatibility with older plugins
                freeCompilerArgs += [
                    '-Xjvm-default=all',
                    '-Xsuppress-version-warnings'
                ]
            }
        }
    }

    // Keep each module's build output organized under root /build/
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(':app')
}

// ✅ Clean task
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
