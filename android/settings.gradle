import java.util.Properties

pluginManagement {
    // Load flutter.sdk from local.properties
    def flutterSdkPath = {
        def properties = new Properties()
        file("local.properties").withInputStream { properties.load(it) }
        def path = properties.getProperty("flutter.sdk")
        assert path != null : "flutter.sdk not set in local.properties"
        return path
    }()

    // Make the Flutter plugin available
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        // Google Maven repository first - mirrors Maven Central and more reliable
        // This is the most reliable source and should be tried first
        google()
        
        // Official Gradle plugin portal for plugins
        gradlePluginPortal()
        
        // Maven Central - use explicit URL to avoid 403 errors from old URLs
        // Use repo1.maven.org instead of repo.maven.apache.org
        maven {
            name = "Maven Central"
            url = uri("https://repo1.maven.org/maven2")
        }
        
        // Fallback: standard mavenCentral() (uses repo1.maven.org internally)
        mavenCentral()
        
        // Additional fallback repositories
        maven {
            name = "Sonatype Snapshots"
            url = uri("https://oss.sonatype.org/content/repositories/snapshots")
        }
    }
    
    resolutionStrategy {
        eachPlugin {
            // Force Flutter plugin loader version
            if (requested.id.id == 'dev.flutter.flutter-plugin-loader') {
                useVersion('1.0.0')
            }
        }
    }
}

// Plugins block: specify plugin versions for Gradle to use when resolving plugin IDs.
// NOTE: Do NOT give dev.flutter.flutter-gradle-plugin an AGP version number here.
plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"

    // ✅ Android Gradle Plugin (compatible with Flutter 3.27+)
    id "com.android.application" version "8.6.0" apply false

    // ✅ Google Services Plugin
    id "com.google.gms.google-services" version "4.4.2" apply false

    // ✅ Kotlin 1.9.x for maximum Flutter plugin compatibility.
    // This also avoids CI failures from transitive plugins still requesting Kotlin languageVersion 1.4.
    id "org.jetbrains.kotlin.android" version "1.9.24" apply false
}

rootProject.name = rootProject.name ?: "mobile-app"
include ":app"

// Exclude flutter_webrtc plugin from build (uses deprecated embedding API)
// We use livekit_client instead which uses dart_webrtc
// Note: Plugin exclusion is handled in app/build.gradle and via removal script
